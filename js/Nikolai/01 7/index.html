<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейронный клеточный автомат</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        canvas {
            max-height: 50vh;
            max-width: 50vw;
            width: auto;
            height: auto;
            border: 1px solid #333;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #444;
        }
        button.active {
            background-color: #555;
        }
        .params {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .param-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="number"] {
            width: 80px;
            background-color: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 5px;
            text-align: center;
        }
        /* Стилизуем стрелочки для числовых полей */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            opacity: 1;
            background-color: #444;
            height: 20px;
        }
        select {
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
        }
        .pattern-selector {
            margin-top: 15px;
        }
        /* Стили для загрузки файла */
        .file-upload {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload label {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .file-upload label:hover {
            background-color: #444;
        }
        .file-name {
            font-size: 0.9em;
            color: #aaa;
        }
        .export-btn {
            background-color: #2c7;
            margin-top: 15px;
        }
        .export-btn:hover {
            background-color: #3d8;
        }
        /* Стили для скрытого холста для экспорта */
        #exportCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="imageCanvas"></canvas>
        <div class="file-upload">
            <label for="imageUpload">Загрузить своё фото</label>
            <input type="file" id="imageUpload" accept="image/*">
            <span class="file-name" id="fileName">Файл не выбран</span>
        </div>
        <div class="controls">
            <button id="toggleBtn">▶️ Старт</button>
            <button id="resetBtn">🔄 Сброс</button>
        </div>
        <div class="params">
            <div class="param-container">
                <label for="learningRate">Скорость обучения:</label>
                <input type="number" id="learningRate" value="0.5" min="0" max="1" step="0.05">
            </div>
            <div class="param-container">
                <label for="noiseLevel">Уровень шума:</label>
                <input type="number" id="noiseLevel" value="0.3" min="0" max="1" step="0.05">
            </div>
        </div>
        <div class="pattern-selector">
            <label for="patternType">Тип паттерна:</label>
            <select id="patternType">
                <option value="organic">Органический</option>
                <option value="crystallize">Кристаллизация</option>
                <option value="flow">Поток</option>
            </select>
        </div>
        <button id="exportBtn" class="export-btn">📥 Экспорт в PNG</button>
        <!-- Скрытый холст для экспорта в высоком разрешении -->
        <canvas id="exportCanvas"></canvas>
    </div>
    <script src="neural-automaton.js"></script>
</body>
</html>
