<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейронный клеточный автомат</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        canvas {
            max-height: 50vh;
            max-width: 50vw;
            width: auto;
            height: auto;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #444;
        }
        .sliders {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="imageCanvas"></canvas>
        <div class="controls">
            <button id="startBtn">Старт</button>
            <button id="stopBtn">Стоп</button>
            <button id="resetBtn">Сброс</button>
        </div>
        <div class="sliders">
            <div class="slider-container">
                <label for="learningRate">Скорость обучения:</label>
                <input type="range" id="learningRate" min="0" max="100" value="50">
            </div>
            <div class="slider-container">
                <label for="noiseLevel">Уровень шума:</label>
                <input type="range" id="noiseLevel" min="0" max="100" value="30">
            </div>
        </div>
    </div>
    <script src="neural-automaton.js"></script>
</body>
</html>
