<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etica Pinta</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./css/styles.css?v=outline-button-1">
  </head>
  <body>
    <div class="container">
      <div class="top-links">
        <button class="yf-tools-link etica-title-button etica-tab-button active" type="button" data-mode-tab="pinta" aria-pressed="true">Etica Pinta</button>
        <button class="yf-tools-link etica-title-button etica-tab-button" type="button" data-mode-tab="foto" aria-pressed="false" hidden>Foto</button>
        <button class="yf-tools-link etica-title-button etica-tab-button" type="button" data-mode-tab="nuevo" aria-pressed="false" hidden>Nuevo</button>
        <button class="yf-tools-link etica-title-button etica-tab-button" type="button" data-mode-tab="flor" aria-pressed="false" hidden>Flor</button>
        <button class="yf-tools-link etica-title-button etica-tab-button" type="button" data-mode-tab="doodleFlor" aria-pressed="false" hidden>Doodle Flor</button>
        <div class="preset-dropdown etica-canvas-dropdown" id="canvasPresetDropdown">
          <button class="preset-dropdown-toggle" id="canvasPresetToggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="canvasPresetMenu">
            <span class="preset-dropdown-text" id="canvasPresetText">1:1</span>
            <svg class="preset-dropdown-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true">
              <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul class="preset-dropdown-menu" id="canvasPresetMenu" role="listbox" aria-label="Canvas preset">
            <li class="preset-dropdown-item selected" role="option" aria-selected="true" data-canvas-preset="1080x1080">1:1</li>
            <li class="preset-dropdown-item" role="option" aria-selected="false" data-canvas-preset="1080x1350">4:5</li>
            <li class="preset-dropdown-item" role="option" aria-selected="false" data-canvas-preset="1080x1440">3:4</li>
            <li class="preset-dropdown-item" role="option" aria-selected="false" data-canvas-preset="1080x1920">9:16</li>
            <li class="preset-dropdown-item" role="option" aria-selected="false" data-canvas-preset="1920x1080">16:9</li>
          </ul>
        </div>
        <button class="preset-dropdown-toggle etica-outline-mode-button" id="outlineModeButton" type="button" aria-pressed="true" hidden>Outline mode</button>
      </div>

      <div class="main-content">
        <div class="canvas-container etica-canvas-container" id="canvasContainer">
          <canvas id="drawingCanvas" width="1080" height="1080" aria-label="Etica drawing canvas"></canvas>
        </div>

        <aside class="controls-panel controls-panel-left etica-panel etica-tools-panel" id="toolsPanel" aria-label="Etica tools panel">
          <div class="panel-header" id="toolsPanelHeader">
            <span>Tools</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse tools panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-simple-section">
              <div class="control-group">
                <fieldset>
                  <legend class="sr-only">Select brush mode</legend>
                  <div class="segmented-control segmented-control-compact">
                    <input type="radio" name="tool" value="dotted" id="toolDotted" data-tool="dotted" checked>
                    <label for="toolDotted">Dots</label>

                    <input type="radio" name="tool" value="ink" id="toolInk" data-tool="ink">
                    <label for="toolInk">Ink</label>

                    <input type="radio" name="tool" value="eraser" id="toolEraser" data-tool="eraser">
                    <label for="toolEraser">Erase</label>

                    <input type="radio" name="tool" value="select" id="toolSelect" data-tool="select">
                    <label for="toolSelect">Select</label>
                  </div>
                </fieldset>
              </div>
            </section>
          </div>
        </aside>

        <aside class="controls-panel etica-panel etica-line-panel" id="linePanel" aria-label="Etica line panel">
          <div class="panel-header" id="linePanelHeader">
            <span>Line</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse line panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-simple-section">
              <div class="control-group">
                <label for="sizeInput">
                  <span>Size <span class="unit">px</span></span>
                  <div class="value-display-wrapper">
                    <input type="text" class="value-display" id="sizeOutput" value="100" inputmode="numeric" aria-label="Brush size value">
                  </div>
                </label>
                <input id="sizeInput" type="range" min="3" max="160" step="1" value="100">
              </div>

              <div class="control-group">
                <label for="densityInput">
                  <span>Density</span>
                  <div class="value-display-wrapper">
                    <input type="text" class="value-display etica-percent-value" id="densityOutput" value="100%" inputmode="numeric" aria-label="Density value">
                  </div>
                </label>
                <input id="densityInput" type="range" min="1" max="320" step="1" value="100">
              </div>

              <div class="control-group">
                <label for="sizeVariationInput">
                  <span>Dot Variation</span>
                  <div class="value-display-wrapper">
                    <input type="text" class="value-display etica-percent-value" id="sizeVariationOutput" value="0%" inputmode="numeric" aria-label="Dot size variation value">
                  </div>
                </label>
                <input id="sizeVariationInput" type="range" min="0" max="100" step="1" value="0">
              </div>

              <div class="control-group">
                <label for="scatterInput">
                  <span>Dot Scatter</span>
                  <div class="value-display-wrapper">
                    <input type="text" class="value-display etica-percent-value" id="scatterOutput" value="30%" inputmode="numeric" aria-label="Dot scatter value">
                  </div>
                </label>
                <input id="scatterInput" type="range" min="0" max="100" step="1" value="30">
              </div>

              <div class="control-group">
                <label for="roughnessInput">
                  <span>Dot Roughness</span>
                  <div class="value-display-wrapper">
                    <input type="text" class="value-display etica-percent-value" id="roughnessOutput" value="70%" inputmode="numeric" aria-label="Dot roughness value">
                  </div>
                </label>
                <input id="roughnessInput" type="range" min="0" max="100" step="1" value="70">
              </div>

              <div class="control-group">
                <label for="densityProfileSelect">
                  <span>Profile</span>
                </label>
                <select id="densityProfileSelect" class="style-select" aria-label="Density profile">
                  <option value="flat" selected>Flat</option>
                  <option value="fade-in">Fade In</option>
                  <option value="fade-out">Fade Out</option>
                  <option value="in-out">In-Out</option>
                  <option value="soft-peak">Soft Peak</option>
                  <option value="hard-peak">Hard Peak</option>
                  <option value="soft-dip">Soft Dip</option>
                  <option value="hard-dip">Hard Dip</option>
                </select>
              </div>

              <div class="etica-line-footer">
                <div class="control-group etica-meta-row">
                  <span>Lines</span>
                  <span id="svgLineMeta">0</span>
                </div>

                <div class="control-group etica-meta-row">
                  <span>Selected</span>
                  <span id="selectionMeta">0</span>
                </div>

                <input class="sr-only" id="svgLineInput" type="file" accept=".svg,image/svg+xml">
                <button class="btn-secondary etica-full-button etica-upload-svg-button" type="button" id="svgLineUploadButton">Upload SVG</button>
              </div>
            </section>
          </div>
        </aside>

        <aside class="controls-panel etica-panel etica-effects-panel" id="effectsPanel" aria-label="Etica effects panel">
          <div class="panel-header" id="effectsPanelHeader">
            <span>Effects</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse effects panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-effects-section">
              <div class="effect-section">
                <div class="section-divider-header">
                  <label class="section-toggle-label" for="windEnabledCheckbox">
                    <input type="checkbox" id="windEnabledCheckbox" class="sr-only">
                    Wind
                  </label>
                </div>
                <div class="effect-section-content controls-disabled" id="windSectionContent">
                  <div class="control-group">
                    <label for="windDirectionInput">
                      <span>Direction</span>
                      <span class="generator-value" id="windDirectionValue">0°</span>
                    </label>
                    <input id="windDirectionInput" type="range" min="0" max="360" step="1" value="0" data-effect-input="wind" data-effect-unit="°">
                  </div>

                  <div class="control-group">
                    <label for="windStrengthInput">
                      <span>Strength</span>
                      <span class="generator-value" id="windStrengthValue">45</span>
                    </label>
                    <input id="windStrengthInput" type="range" min="0" max="100" step="1" value="45" data-effect-input="wind">
                  </div>

                  <div class="control-group">
                    <label for="windTrailInput">
                      <span>Trail Length</span>
                      <span class="generator-value" id="windTrailValue">120</span>
                    </label>
                    <input id="windTrailInput" type="range" min="0" max="420" step="1" value="120" data-effect-input="wind">
                  </div>

                  <div class="control-group">
                    <label for="windDestructionInput">
                      <span>Destruction</span>
                      <span class="generator-value" id="windDestructionValue">40</span>
                    </label>
                    <input id="windDestructionInput" type="range" min="0" max="100" step="1" value="40" data-effect-input="wind">
                  </div>

                  <div class="control-group">
                    <label for="windUniformityInput">
                      <span>Uniformity</span>
                      <span class="generator-value" id="windUniformityValue">35</span>
                    </label>
                    <input id="windUniformityInput" type="range" min="0" max="100" step="1" value="35" data-effect-input="wind">
                  </div>
                </div>
              </div>

              <div class="effect-section">
                <div class="section-divider-header">
                  <label class="section-toggle-label" for="boilEnabledCheckbox">
                    <input type="checkbox" id="boilEnabledCheckbox" class="sr-only" checked>
                    Boil
                  </label>
                  <button class="effect-preview-button" type="button" id="boilPreviewButton" aria-label="Preview Boil animation" title="Preview Boil">
                    <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
                      <path d="M3.25 2.1 9.25 6l-6 3.9Z" fill="currentColor"/>
                    </svg>
                  </button>
                </div>
                <div class="effect-section-content" id="boilSectionContent">
                  <div class="control-group">
                    <label for="boilAmountInput">
                      <span>Amount</span>
                      <span class="generator-value" id="boilAmountValue">42</span>
                    </label>
                    <input id="boilAmountInput" type="range" min="0" max="100" step="1" value="42" data-effect-input="boil">
                  </div>

                  <div class="control-group">
                    <label for="boilFramesInput">
                      <span>Frames</span>
                      <span class="generator-value" id="boilFramesValue">4</span>
                    </label>
                    <input id="boilFramesInput" type="range" min="2" max="8" step="1" value="4" data-effect-input="boil">
                  </div>

                  <div class="control-group">
                    <label for="boilFpsInput">
                      <span>FPS</span>
                      <span class="generator-value" id="boilFpsValue">8</span>
                    </label>
                    <input id="boilFpsInput" type="range" min="2" max="18" step="1" value="8" data-effect-input="boil">
                  </div>
                </div>
              </div>
            </section>
          </div>
        </aside>

        <aside class="controls-panel etica-panel etica-background-panel" id="backgroundPanel" aria-label="Etica background panel">
          <div class="panel-header" id="backgroundPanelHeader">
            <span>Background</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse background panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-simple-section">
              <div class="color-swatches-compact">
                <div class="color-swatch-row active" id="backgroundColorRow">
                  <div class="color-swatch-compact" id="backgroundColorItem">
                    <button type="button" class="color-dot color-dot--expandable" id="backgroundColorPreview" title="HSB" aria-label="Open background color controls"></button>
                    <span class="color-label">Background</span>
                    <input type="text" class="color-swatch-hex" id="backgroundColorHex" value="#bbbbbb" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Background color hex">
                  </div>
                  <div class="color-hsb-slot" id="backgroundColorHsbSlot">
                    <div class="etica-hsb-picker" id="backgroundColorPicker" hidden>
                      <div class="hsb-controls">
                        <div class="hsb-control-group">
                          <label for="backgroundHueInput">
                            <span>Hue</span>
                            <input type="text" class="value-display hsb-value" id="backgroundHueValue" value="0°" readonly>
                          </label>
                          <input type="range" id="backgroundHueInput" min="0" max="360" step="1" value="0">
                        </div>

                        <div class="hsb-control-group">
                          <label for="backgroundSaturationInput">
                            <span>Saturation</span>
                            <input type="text" class="value-display hsb-value" id="backgroundSaturationValue" value="0%" readonly>
                          </label>
                          <input type="range" id="backgroundSaturationInput" min="0" max="100" step="1" value="0">
                        </div>

                        <div class="hsb-control-group">
                          <label for="backgroundBrightnessInput">
                            <span>Brightness</span>
                            <input type="text" class="value-display hsb-value" id="backgroundBrightnessValue" value="2%" readonly>
                          </label>
                          <input type="range" id="backgroundBrightnessInput" min="0" max="100" step="1" value="2">
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="color-swatch-row" id="brushColorRow">
                  <div class="color-swatch-compact" id="brushColorItem">
                    <button type="button" class="color-dot color-dot--expandable" id="brushColorPreview" title="HSB" aria-label="Open brush color controls"></button>
                    <span class="color-label">Brush</span>
                    <input type="text" class="color-swatch-hex" id="brushColorHex" value="#ffffff" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Brush color hex">
                  </div>
                  <div class="color-hsb-slot" id="brushColorHsbSlot">
                    <div class="etica-hsb-picker" id="brushColorPicker" hidden>
                      <div class="hsb-controls">
                        <div class="hsb-control-group">
                          <label for="brushHueInput">
                            <span>Hue</span>
                            <input type="text" class="value-display hsb-value" id="brushHueValue" value="0°" readonly>
                          </label>
                          <input type="range" id="brushHueInput" min="0" max="360" step="1" value="0">
                        </div>

                        <div class="hsb-control-group">
                          <label for="brushSaturationInput">
                            <span>Saturation</span>
                            <input type="text" class="value-display hsb-value" id="brushSaturationValue" value="0%" readonly>
                          </label>
                          <input type="range" id="brushSaturationInput" min="0" max="100" step="1" value="0">
                        </div>

                        <div class="hsb-control-group">
                          <label for="brushBrightnessInput">
                            <span>Brightness</span>
                            <input type="text" class="value-display hsb-value" id="brushBrightnessValue" value="100%" readonly>
                          </label>
                          <input type="range" id="brushBrightnessInput" min="0" max="100" step="1" value="100">
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="color-swap-row">
                  <button class="btn-secondary color-swap-button" type="button" id="swapColorsButton" aria-label="Swap background and brush colors" title="Swap background and brush colors">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true">
                      <path d="M3.2 5.2h8.4l-2-2M12.8 10.8H4.4l2 2" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Swap colors</span>
                  </button>
                </div>
              </div>

              <div class="control-group etica-meta-row">
                <span>Image</span>
                <span id="backgroundMeta">None</span>
              </div>
              <div class="control-group">
                <fieldset>
                  <legend class="sr-only">Background image fit mode</legend>
                  <div class="segmented-control segmented-control-compact">
                    <input type="radio" name="backgroundFit" value="fit" id="backgroundFitMode" data-background-fit="fit">
                    <label for="backgroundFitMode">Fit</label>

                    <input type="radio" name="backgroundFit" value="fill" id="backgroundFillMode" data-background-fit="fill" checked>
                    <label for="backgroundFillMode">Fill</label>
                  </div>
                </fieldset>
              </div>
              <input class="sr-only" id="backgroundInput" type="file" accept="image/*">
              <div class="button-group etica-panel-buttons">
                <button class="btn-secondary" type="button" id="backgroundButton">Upload</button>
                <button class="btn-secondary" type="button" id="clearBackgroundButton" disabled>Clear</button>
              </div>
            </section>
          </div>
        </aside>

        <aside class="controls-panel etica-panel etica-generator-panel" id="fotoPanel" aria-label="Etica Foto panel" hidden>
          <div class="panel-header" id="fotoPanelHeader">
            <span>Foto</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse Foto panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-simple-section">
              <div class="control-group etica-meta-row">
                <span>Source</span>
                <span id="fotoMeta">None</span>
              </div>
              <input class="sr-only" id="fotoInput" type="file" accept="image/*">
              <button class="btn-secondary etica-full-button" type="button" id="fotoUploadButton">Upload Photo</button>

              <div class="control-group">
                <fieldset>
                  <legend class="sr-only">Foto fit mode</legend>
                  <div class="segmented-control segmented-control-compact">
                    <input type="radio" name="fotoFit" value="fit" id="fotoFitMode" data-foto-fit="fit">
                    <label for="fotoFitMode">Fit</label>

                    <input type="radio" name="fotoFit" value="fill" id="fotoFillMode" data-foto-fit="fill" checked>
                    <label for="fotoFillMode">Fill</label>
                  </div>
                </fieldset>
              </div>

              <div class="control-group">
                <label for="fotoRecognitionInput"><span>Recognition</span><span class="generator-value" id="fotoRecognitionValue">70</span></label>
                <input id="fotoRecognitionInput" type="range" min="0" max="100" step="1" value="70" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoAbstractionInput"><span>Abstraction</span><span class="generator-value" id="fotoAbstractionValue">34</span></label>
                <input id="fotoAbstractionInput" type="range" min="0" max="100" step="1" value="34" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoDetailInput"><span>Detail</span><span class="generator-value" id="fotoDetailValue">52</span></label>
                <input id="fotoDetailInput" type="range" min="0" max="100" step="1" value="52" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoMassInput"><span>Mass</span><span class="generator-value" id="fotoMassValue">56</span></label>
                <input id="fotoMassInput" type="range" min="0" max="100" step="1" value="56" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoContourInput"><span>Contour</span><span class="generator-value" id="fotoContourValue">48</span></label>
                <input id="fotoContourInput" type="range" min="0" max="100" step="1" value="48" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoDensityInput"><span>Density</span><span class="generator-value" id="fotoDensityValue">56</span></label>
                <input id="fotoDensityInput" type="range" min="0" max="100" step="1" value="56" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoDotSizeInput"><span>Dot Size</span><span class="generator-value" id="fotoDotSizeValue">14</span></label>
                <input id="fotoDotSizeInput" type="range" min="3" max="90" step="1" value="14" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoSizeVariationInput"><span>Dot Variation</span><span class="generator-value" id="fotoSizeVariationValue">0%</span></label>
                <input id="fotoSizeVariationInput" type="range" min="0" max="100" step="1" value="0" data-generator-input="foto" data-generator-unit="%">
              </div>
              <div class="control-group">
                <label for="fotoJitterInput"><span>Jitter</span><span class="generator-value" id="fotoJitterValue">44</span></label>
                <input id="fotoJitterInput" type="range" min="0" max="100" step="1" value="44" data-generator-input="foto">
              </div>
              <div class="control-group">
                <label for="fotoMaxPointsInput"><span>Max Points</span><span class="generator-value" id="fotoMaxPointsValue">2500</span></label>
                <input id="fotoMaxPointsInput" type="range" min="10" max="8000" step="10" value="2500" data-generator-input="foto">
              </div>
              <div class="control-group generator-seed-row">
                <label for="fotoSeedInput"><span>Seed</span></label>
                <input type="text" class="value-display generator-seed-input" id="fotoSeedInput" value="2401" inputmode="numeric">
              </div>
              <div class="button-group etica-panel-buttons generator-actions">
                <button class="btn-secondary etica-full-button" type="button" id="fotoRegenerateButton" disabled>Regenerate</button>
              </div>
            </section>
          </div>
        </aside>

        <aside class="controls-panel etica-panel etica-generator-panel" id="nuevoPanel" aria-label="Etica Nuevo panel" hidden>
          <div class="panel-header" id="nuevoPanelHeader">
            <span>Nuevo</span>
            <span class="collapse-icon" role="button" tabindex="0" aria-label="Collapse Nuevo panel">
              <svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true">
                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>

          <div class="panel-content">
            <section class="control-section etica-simple-section">
              <div class="control-group etica-meta-row">
                <span>Source</span>
                <span id="nuevoMeta">None</span>
              </div>
              <input class="sr-only" id="nuevoInput" type="file" accept="image/*">
