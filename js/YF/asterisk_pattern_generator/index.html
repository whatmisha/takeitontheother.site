<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../infra/qa/ui-audit/runtime-probe.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asterisk Pattern</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../infra/framework/css/othersite-styles.css">
    <link rel="stylesheet" href="../infra/framework/css/generator-host.css?v=3">
    <link rel="stylesheet" href="../infra/framework/css/ui-contract.css?v=uiq-5">
</head>
<body>
    <a class="upgrade-migration-preview" href="../" aria-label="YF Tools — return to main page">← YF Tools</a>
    <div class="container">
        <canvas id="patternCanvas" width="1920" height="1080"></canvas>
    </div>
    <div class="controls">
        <div class="sliders-row">
            <div class="control-group">
                <label for="lineThickness">Line width</label>
                <input type="range" id="lineThickness" min="1" max="100" step="1" value="50">
                <span id="lineThicknessValue">50px</span>
            </div>
            <div class="control-group">
                <label for="cornerRadius">Corner radius</label>
                <input type="range" id="cornerRadius" min="0" max="360" step="1" value="120">
                <span id="cornerRadiusValue">120px</span>
            </div>
            <div class="control-group">
                <label for="duplicateLayers">Duplicate layers</label>
                <input type="range" id="duplicateLayers" min="0" max="100" step="1" value="0">
                <span id="duplicateLayersValue">0</span>
            </div>
            <div class="control-group">
                <label for="scaleDown">Scale</label>
                <input type="range" id="scaleDown" min="0" max="7" step="1" value="0">
                <span id="scaleDownValue">1:1</span>
            </div>
        </div>
        <div class="checkboxes-row">
            <div class="control-group">
                <input type="checkbox" id="roundedCaps">
                <label for="roundedCaps">Round caps</label>
            </div>
            <div class="control-group">
                <input type="checkbox" id="tessellationMode" checked>
                <label for="tessellationMode">Tessellation</label>
            </div>
            <div class="control-group">
                <input type="checkbox" id="showGrid" checked>
                <label for="showGrid">Show grid</label>
            </div>
            <button id="exportSVG">SVG ⌘E</button>
        </div>
    </div>
    <script src="script.js?v=integration-9&layout=root-infra-1"></script>
</body>
</html>
