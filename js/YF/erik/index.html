<!doctype html>
<html lang="en" data-tool-name="Erik">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erik — YF Tools</title><meta name="description" content="Perspective typography in motion. Create a cinematic text crawl with Lunnen Display and export MP4 or transparent PNG.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../infra/framework/css/othersite-styles.css?v=erik-1">
<link rel="stylesheet" href="./app.css?v=11">
<link rel="stylesheet" href="../infra/framework/css/ui-contract.css?v=panel-resize-1&rev=2">
</head><body>
<div class="container erik">
<header class="top-links" aria-label="Tool navigation"><a class="top-link" href="../">← YF Tools</a>
<div class="preset-toolbar-cluster"><div class="preset-dropdown" id="presetDropdown"><button class="preset-dropdown-toggle" id="presetDropdownToggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="presetDropdownMenu"><span class="preset-dropdown-text">Presets</span><svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="preset-dropdown-menu" id="presetDropdownMenu" role="listbox"></ul></div><button id="savePresetBtn" class="top-link" type="button" style="display:none">Save preset</button>
<button id="presetToolbarShareBtn" class="preset-toolbar-share-btn" type="button" aria-label="Copy share link" data-tooltip="Copy share link"><svg viewBox="0 0 12 12" width="18" height="18" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-linecap="round" stroke-width="1.2" d="M5.74 3.43l.61-.61a2 2 0 0 1 2.83 2.83l-.61.61M6.26 8.57l-.61.61a2 2 0 0 1-2.83-2.83l.61-.61M7.52 4.48 4.48 7.52"/></svg></button><input id="presetFile" type="file" accept=".json,application/json" hidden></div>
</header>
<main class="main-content"><h1 class="sr-only">Erik — perspective text crawl</h1>
<section class="preview-workspace" aria-label="Preview workspace"><p id="presetStatus" class="sr-only" aria-live="polite">Crawl</p><div class="canvas-container" id="canvasContainer"><canvas id="mainCanvas" role="img" aria-label="Perspective text crawl preview"></canvas><div id="artboardEdge" class="ui-artboard" aria-hidden="true"></div></div><div id="emptyState" class="empty-state" hidden>Add a logo or text to start.</div></section>
<aside class="controls-panel" id="contentPanel" aria-label="Content"><div class="panel-header" id="contentPanelHeader"><span>Content</span><button class="collapse-icon" type="button" aria-label="Collapse content"><svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="panel-content"><div class="segmented-control content-tabs" role="tablist" aria-label="Content section"><button id="crawlTab" type="button" role="tab" aria-selected="true" aria-controls="crawlContent">Crawl</button><button id="endingTab" type="button" role="tab" aria-selected="false" aria-controls="endingContent" tabindex="-1">Ending</button></div><div id="crawlContent" role="tabpanel" aria-labelledby="crawlTab"><details class="ui-disclosure"><summary>Logo<svg class="ui-disclosure__chevron" width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary><label class="sr-only" for="titleInput">Logo text</label><textarea id="titleInput" rows="2" maxlength="200" placeholder="Lunnen&#10;Airis" spellcheck="false"></textarea></details>
<div class="text-label"><label for="bodyInput">Text</label><div class="text-editor-actions"><output id="characterCount">0 / 6000</output><button id="expandText" class="text-expand-button" type="button" aria-label="Expand text editor" data-tooltip="Expand text editor"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M10 2h4v4M14 2 9 7M6 14H2v-4M2 14l5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><textarea id="bodyInput" rows="5" maxlength="6000" spellcheck="false"></textarea></div><div id="endingContent" role="tabpanel" aria-labelledby="endingTab" hidden>
<label class="stacked-select-label" for="endingTypeInput">Type<select id="endingTypeInput" class="style-select"><option value="none">None</option><option value="text">Text</option><option value="svg">SVG</option><option value="lottie">Lottie</option></select></label>
<div id="endingTextControl"><label class="sr-only" for="endingTextInput">Ending text</label><textarea id="endingTextInput" rows="2" maxlength="500" spellcheck="false"></textarea></div>
<div id="endingFileControl" class="file-intake"><input id="endingFileInput" type="file" hidden><button id="chooseEndingFile" type="button" class="panel-action">Choose file</button><div class="ending-file-caption"><output id="endingFileName"></output><button id="removeEndingFile" type="button" class="text-expand-button" aria-label="Remove ending file" hidden>×</button></div></div>
<div id="endingOptions"><div class="control-group"><label for="endingScaleSlider"><span>Size %</span><input id="endingScaleValue" class="value-display" type="text" inputmode="decimal" aria-label="Size % value" min="10" max="100" step="1" value="60"></label><input id="endingScaleSlider" type="range" min="10" max="100" step="1" value="60"></div><div class="control-group"><label for="endingDurationSlider"><span>Duration · s</span><input id="endingDurationValue" class="value-display" type="text" inputmode="decimal" aria-label="Duration · s value" min="1" max="30" step="0.5" value="3"></label><input id="endingDurationSlider" type="range" min="1" max="30" step="0.5" value="3"></div><div class="ending-fades"><label class="toggle-label ending-fade-label"><span class="toggle-switch"><input id="endingFadeInInput" type="checkbox"><span class="toggle-slider"></span></span><span>Fade in</span></label><label class="toggle-label ending-fade-label"><span class="toggle-switch"><input id="endingFadeOutInput" type="checkbox"><span class="toggle-slider"></span></span><span>Fade out</span></label></div></div><p id="endingAssetStatus" class="ending-asset-status" role="status" aria-live="polite"></p></div></div></aside>
<aside class="controls-panel" id="textStylePanel" aria-label="Text style"><div class="panel-header" id="textStylePanelHeader"><span>Text style</span><button class="collapse-icon" type="button" aria-label="Collapse text style"><svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="panel-content"><div class="control-group"><label for="fontSizeSlider"><span>Font size</span><input id="fontSizeValue" class="value-display" type="text" inputmode="decimal" aria-label="Font size value" min="32" max="120" step="1" value="42"></label><input id="fontSizeSlider" type="range" min="32" max="120" step="1" value="42"></div><div class="control-group"><label for="lineHeightSlider"><span>Line spacing ×</span><input id="lineHeightValue" class="value-display" type="text" inputmode="decimal" aria-label="Line spacing × value" min="0.8" max="3" step="0.05" value="1.5"></label><input id="lineHeightSlider" type="range" min="0.8" max="3" step="0.05" value="1.5"></div><div class="control-group" id="creditGapControl"><label for="creditGapSlider"><span>Column gap</span><input id="creditGapValue" class="value-display" type="text" inputmode="decimal" aria-label="Column gap value" min="0" max="160" step="1" value="48"></label><input id="creditGapSlider" type="range" min="0" max="160" step="1" value="48"></div><div class="control-group"><label for="weightSlider"><span>Weight</span><input id="weightValue" class="value-display" type="text" inputmode="decimal" aria-label="Weight value" min="100" max="400" step="1" value="400"></label><input id="weightSlider" type="range" min="100" max="400" step="1" value="400"></div><div class="control-group"><label for="trackingSlider"><span>Tracking</span><input id="trackingValue" class="value-display" type="text" inputmode="decimal" aria-label="Tracking value" min="-2" max="8" step="0.1" value="0"></label><input id="trackingSlider" type="range" min="-2" max="8" step="0.1" value="0"></div><div class="control-group"><label for="columnWidthSlider"><span>Text measure</span><input id="columnWidthValue" class="value-display" type="text" inputmode="decimal" aria-label="Text measure value" min="600" max="1500" step="10" value="1120"></label><input id="columnWidthSlider" type="range" min="600" max="1500" step="10" value="1120"></div><section class="control-field-group" aria-labelledby="colorHeading"><h3 class="control-field-heading" id="colorHeading">Colors</h3><div class="color-swatch-row"><div class="color-swatch-compact" id="textColorItem"><button type="button" class="color-dot color-dot--expandable" id="textColorDot" aria-label="Choose text"></button><span class="color-label">Text</span><input class="color-swatch-hex" id="textColorHex" aria-label="Text hex" maxlength="7"></div><div class="color-hsb-slot" id="textColorSlot"></div></div><div class="color-swatch-row"><div class="color-swatch-compact" id="backgroundColorItem"><button type="button" class="color-dot color-dot--expandable" id="backgroundColorDot" aria-label="Choose background"></button><span class="color-label">Background</span><input class="color-swatch-hex" id="backgroundColorHex" aria-label="Background hex" maxlength="7"></div><div class="color-hsb-slot" id="backgroundColorSlot"></div></div><div id="colorPicker"></div></section></div></aside>
<aside class="controls-panel" id="motionPanel" aria-label="Motion"><div class="panel-header" id="motionPanelHeader"><span>Motion</span><button class="collapse-icon" type="button" aria-label="Collapse motion"><svg width="10" height="6" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="panel-content ui-control-stack"><div class="control-group"><label for="speedSlider"><span>Speed</span><input id="speedValue" class="value-display" type="text" inputmode="decimal" aria-label="Speed value" min="10" max="400" step="1" value="120"></label><input id="speedSlider" type="range" min="10" max="400" step="1" value="120"></div><div class="control-group"><label for="tiltSlider"><span>Tilt °</span><input id="tiltValue" class="value-display" type="text" inputmode="decimal" aria-label="Tilt ° value" min="30" max="80" step="1" value="70"></label><input id="tiltSlider" type="range" min="30" max="80" step="1" value="70"></div><div class="control-group"><label for="perspectiveSlider"><span>Perspective</span><input id="perspectiveValue" class="value-display" type="text" inputmode="decimal" aria-label="Perspective value" min="60" max="180" step="1" value="100"></label><input id="perspectiveSlider" type="range" min="60" max="180" step="1" value="100"></div><div class="control-group"><label for="logoGapSlider"><span>Logo → text gap</span><input id="logoGapValue" class="value-display" type="text" inputmode="decimal" aria-label="Logo → text gap value" min="-2400" max="2400" step="10" value="450"></label><input id="logoGapSlider" type="range" min="-2400" max="2400" step="10" value="450"></div><div class="control-group"><label for="endingGapSlider"><span>Crawl → ending gap</span><input id="endingGapValue" class="value-display" type="text" inputmode="decimal" aria-label="Crawl → ending gap value" min="-2400" max="2400" step="10" value="0"></label><input id="endingGapSlider" type="range" min="-2400" max="2400" step="10" value="0"></div></div></aside>
<aside class="controls-panel tool-palette transport" id="timelinePanel" aria-label="Playback controls"><div class="tool-palette-grip" id="timelinePanelHeader" title="Drag timeline"><svg viewBox="0 0 12 16" width="12" height="16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="1"/><circle cx="8" cy="4" r="1"/><circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/></svg></div><div class="tool-palette-body"><div class="transport-top"><span id="scenePhase">Logo</span><div class="transport-buttons"><button class="panel-action panel-action--icon" type="button" id="playButton" aria-label="Play" title="Play (Space)"><svg id="playIcon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M6 3.5 14 9 6 14.5Z"/></svg><svg id="pauseIcon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true" hidden><rect x="4" y="4" width="3" height="10" rx=".5"/><rect x="11" y="4" width="3" height="10" rx=".5"/></svg></button><button class="panel-action panel-action--icon" type="button" id="stopButton" aria-label="Stop" title="Stop and return to start"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="10" height="10" rx="1"/></svg></button></div><div class="time-readout"><input id="currentTime" aria-label="Current timecode" value="00:00:00" maxlength="9" title="Minutes:seconds:frames · 30 fps"><span>/</span><output id="totalTime">00:00:00</output></div></div><div class="timeline-track control-group"><div class="timeline-markers" aria-hidden="true"><i id="textMarker"></i><i id="logoMarker"></i><i id="fadeMarker"></i><i id="endingMarker"></i></div><input id="timeline" type="range" aria-label="Timeline frame" min="0" max="1" step="1" value="0"></div></div></aside>
</main>
<div class="status-area"><p id="operationStatus" role="status" aria-live="polite">Loading Lunnen Display…</p></div>
<nav class="bottom-buttons action-dock" role="toolbar" aria-label="Tool actions"><div class="action-dock__slot action-dock__slot--utility"><button id="resetButton" class="btn-fixed btn-fixed--muted" type="button">Reset</button><button id="copyPreset" class="btn-fixed btn-fixed--muted" type="button" data-action-dock-extra hidden>Save as</button><button id="downloadPreset" class="btn-fixed btn-fixed--muted" type="button" data-action-dock-extra hidden>Export JSON</button><button id="importPreset" class="btn-fixed btn-fixed--muted" type="button" data-action-dock-extra hidden>Import JSON</button></div><div id="exportActions" class="action-dock__slot action-dock__slot--primary export-progress-actions"><button id="exportMp4" class="btn-fixed" type="button" disabled>MP4</button><button id="exportSequence" class="btn-fixed btn-fixed--muted" type="button" disabled>PNG sequence</button><button id="exportFrame" class="btn-fixed btn-fixed--muted" type="button" disabled>Current frame</button><div id="exportStatus" class="export-progress-status" hidden role="status" aria-live="polite"><progress id="exportProgress" max="1" value="0" aria-label="Export progress"></progress><span id="exportMessage">Preparing…</span><button id="cancelExport" type="button" aria-label="Cancel export" data-tooltip="Cancel export">×</button></div></div></nav>
</div><dialog id="dialog" class="modal" aria-labelledby="dialogTitle"><div class="modal-content"><h2 id="dialogTitle"></h2><div id="dialogText"></div><input id="dialogInput" class="modal-input" maxlength="80" aria-label="Name"><div id="dialogButtons" class="modal-buttons"></div></div></dialog>
<dialog id="textEditorDialog" class="modal text-editor-dialog" aria-labelledby="textEditorTitle"><div class="modal-content"><h2 id="textEditorTitle">Edit text</h2><div id="textEditorNote" class="modal-text"></div><textarea id="expandedBodyInput" class="modal-input" aria-label="Expanded text" maxlength="6000" wrap="off" spellcheck="false"></textarea><div id="textEditorButtons" class="modal-buttons"></div></div></dialog>
<template id="textHelpTemplate"><section class="text-syntax-help" aria-label="Text formatting"><p><code>role | name</code> — two columns<br><code>-heading-</code> — centered heading</p><p>Ending follows the crawl by default. Both gap controls are in Motion; negative values advance the next element. Their timing follows Speed; Duration is in seconds. SVG and Lottie retain their own colors. Lottie plays once at its original speed, then holds the last frame. Embed images and outline fonts; files up to 5 MB.</p></section></template>
<script type="module" src="./tool.js?v=21"></script>
<script type="module" src="../infra/framework/src/ui/panelResizeAutoInit.js?v=9"></script>
</body></html>
