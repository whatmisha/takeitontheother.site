    <!-- Paragraph Settings Panel -->
    <aside class="controls-panel paragraph-settings-panel" id="paragraphPanel" style="display: none;" role="complementary" aria-label="Paragraph settings">
        <div class="panel-header" id="paragraphPanelHeader">
            <span id="paragraphPanelTitle">Paragraph Settings</span>
            <div class="panel-header-actions">
                <button type="button" class="panel-action-btn" id="paragraphHideBtn" aria-label="Hide paragraph">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 3C4.5 3 1.7 5.6 1 8c.7 2.4 3.5 5 7 5s6.3-2.6 7-5c-.7-2.4-3.5-5-7-5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" class="panel-action-btn" id="paragraphDuplicateBtn" aria-label="Duplicate paragraph">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </button>
                <button type="button" class="panel-action-btn" id="paragraphDeleteBtn" aria-label="Delete paragraph">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 4h12M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1m2 0v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h10z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="panel-content">
            <section class="control-section">
                <div class="control-group">
                    <label for="paragraphSurfaceSelect">
                        <span>Surface</span>
                        <select id="paragraphSurfaceSelect" class="style-select" aria-label="Text surface">
                            <option value="front">Front</option>
                            <option value="left">Left</option>
                            <option value="right">Right</option>
                            <option value="top">Top</option>
                            <option value="bottom">Bottom</option>
                        </select>
                    </label>
                </div>

                <div class="control-group">
                    <label for="paragraphStyleSelect">
                        <select id="paragraphStyleSelect" class="style-select" aria-label="Text style">
                            <option value="headline">Headline</option>
                            <option value="text">Text</option>
                            <option value="caption">Caption</option>
                            <option value="lunnenDisplay">Lunnen Display</option>
                        </select>
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="paragraphXInput">
                        <span>Column</span>
                        <input type="text" class="value-display" id="paragraphXInput" value="1" data-min="1" data-max="12" aria-label="Column position">
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="paragraphRowInput">
                        <span>Row</span>
                        <input type="text" class="value-display" id="paragraphRowInput" value="1" data-min="1" data-max="50" aria-label="Row position">
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="paragraphBaselineInput">
                        <span>Baseline</span>
                        <input type="text" class="value-display" id="paragraphBaselineInput" value="1" data-min="1" data-max="500" aria-label="Baseline position on grid">
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="paragraphWidthInput">
                        <span>Width <span class="unit">col</span></span>
                        <input type="text" class="value-display" id="paragraphWidthInput" value="6" data-min="0.25" data-max="12" data-step="0.25" aria-label="Width in columns">
                    </label>
                </div>
                
                <div class="control-group">
                    <label>
                        <span>Alignment Mode</span>
                    </label>
                    <fieldset>
                        <legend class="sr-only">Text alignment mode</legend>
                        <div class="segmented-control segmented-control-compact" role="radiogroup" aria-label="Alignment mode selection">
                            <input type="radio" name="alignmentMode" value="baseline" id="alignmentModeBaseline" checked aria-label="Baseline alignment">
                            <label for="alignmentModeBaseline">Baseline</label>
                            
                            <input type="radio" name="alignmentMode" value="x-height" id="alignmentModeXHeight" aria-label="X-height alignment">
                            <label for="alignmentModeXHeight">X-Height</label>
                            
                            <input type="radio" name="alignmentMode" value="cap-height" id="alignmentModeCapHeight" aria-label="Cap height alignment">
                            <label for="alignmentModeCapHeight">Cap Height</label>
                        </div>
                    </fieldset>
                </div>
                
                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="paragraphLockPositionToggle" aria-label="Constrain to grid">
                        <span>Constrain to Grid</span>
                    </label>
                </div>
                
                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="paragraphAlignRightToggle" aria-label="Align to right edge">
                        <span>Align Right</span>
                    </label>
                </div>
                
                <div class="control-group">
                    <label class="control-label">
                        <span>Text Alignment</span>
                    </label>
                    <fieldset>
                        <legend class="sr-only">Text alignment selection</legend>
                        <div class="segmented-control segmented-control-compact" role="radiogroup" aria-label="Text alignment selection">
                            <input type="radio" name="textAlignment" value="left" id="textAlignmentLeft" checked aria-label="Left align text">
                            <label for="textAlignmentLeft">Left</label>
                            
                            <input type="radio" name="textAlignment" value="center" id="textAlignmentCenter" aria-label="Center align text">
                            <label for="textAlignmentCenter">Center</label>
                            
                            <input type="radio" name="textAlignment" value="right" id="textAlignmentRight" aria-label="Right align text">
                            <label for="textAlignmentRight">Right</label>
                        </div>
                    </fieldset>
                </div>
            </section>
            
            <section class="control-section">
                <h3>
                    Text
                    <span class="char-counter" id="charCounter">0 characters</span>
                </h3>
                
                <div class="control-group">
                    <textarea id="paragraphTextArea" placeholder="Enter text here..." rows="7" aria-label="Paragraph text"></textarea>
                </div>
                
                <div class="control-group">
                    <div class="toggle-chip-group text-preset-chips" id="textPresetChips" role="group" aria-label="Text presets">
                    </div>
                </div>
            </section>
            
            <section class="control-section" id="lunnenDisplayFeaturesSection" style="display: none;">
                <h3>Lunnen Display</h3>
                
                <div class="control-group">
                    <label for="lunnenDisplayWeightSlider">
                        <span>Weight</span>
                        <input type="text" class="value-display" id="lunnenDisplayWeightValue" value="400" data-min="100" data-max="400" aria-label="Font weight">
                    </label>
                    <input type="range" id="lunnenDisplayWeightSlider" min="100" max="400" step="1" value="400" aria-label="Font weight slider">
                </div>
                
                <div class="control-group">
                    <div class="toggle-chip-group" role="group" aria-label="OpenType features">
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureSalt" aria-label="Enable salt feature">
                            <span>salt</span>
                        </label>
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureAalt" aria-label="Enable aalt feature">
                            <span>aalt</span>
                        </label>
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureSs01" aria-label="Enable ss01 feature">
                            <span>ss01</span>
                        </label>
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureSs02" aria-label="Enable ss02 feature">
                            <span>ss02</span>
                        </label>
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureTnum" aria-label="Enable tnum feature">
                            <span>tnum</span>
                        </label>
                        <label class="toggle-chip">
                            <input type="checkbox" id="featureDlig" aria-label="Enable dlig feature">
                            <span>dlig</span>
                        </label>
                    </div>
                </div>
            </section>
        </div>
    </aside>

    <!-- Graphics Upload Panel -->
    <aside class="controls-panel paragraph-settings-panel" id="graphicsPanel" style="display: none;" role="complementary" aria-label="Graphics upload">
        <div class="panel-header" id="graphicsPanelHeader">
            <span id="graphicsPanelTitle">Add Graphics</span>
            <div class="panel-header-actions">
                <button type="button" class="panel-action-btn" id="graphicsHideBtn" aria-label="Hide graphics">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 3C4.5 3 1.7 5.6 1 8c.7 2.4 3.5 5 7 5s6.3-2.6 7-5c-.7-2.4-3.5-5-7-5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/>
                        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" class="panel-action-btn" id="graphicsDuplicateBtn" aria-label="Duplicate graphics">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </button>
                <button type="button" class="panel-action-btn" id="graphicsDeleteBtn" aria-label="Delete graphics">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 4h12M5 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1m2 0v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h10z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="panel-content">
            <section class="control-section">
                <div class="control-group">
                    <div class="file-upload-area" id="fileUploadArea">
                        <input type="file" id="svgFileInput" accept=".svg" style="display: none;">
                        <div class="upload-placeholder">
                            <p>Click or drag & drop SVG file here</p>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="graphicsSurfaceSelect">
                        <span>Surface</span>
                        <select id="graphicsSurfaceSelect" class="style-select" aria-label="Graphics surface">
                            <option value="front">Front</option>
                            <option value="left">Left</option>
                            <option value="right">Right</option>
                            <option value="top">Top</option>
                            <option value="bottom">Bottom</option>
                        </select>
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="graphicsXInput">
                        <span>Column</span>
                        <input type="text" class="value-display" id="graphicsXInput" value="1" data-min="1" data-max="12" aria-label="Column position">
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="graphicsRowInput">
                        <span>Row</span>
                        <input type="text" class="value-display" id="graphicsRowInput" value="1" data-min="1" data-max="50" aria-label="Row position">
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="graphicsBaselineInput">
                        <span>Baseline</span>
                        <input type="text" class="value-display" id="graphicsBaselineInput" value="1" data-min="1" data-max="500" aria-label="Baseline position on grid">
                    </label>
                </div>
                
                <div class="control-group">
                    <label>
                        <span>Size Mode</span>
                        <div class="toggle-group" style="display: flex; gap: 4px; margin-top: 4px;">
                            <label class="toggle-chip" style="flex: 1;">
                                <input type="radio" name="graphicsSizeMode" id="graphicsSizeModeWidth" value="width" aria-label="Size by width">
                                <span>Width</span>
                            </label>
                            <label class="toggle-chip" style="flex: 1;">
                                <input type="radio" name="graphicsSizeMode" id="graphicsSizeModeHeight" value="height" checked aria-label="Size by height">
                                <span>Height</span>
                            </label>
                        </div>
                    </label>
                </div>
                
                <div class="control-group" id="graphicsWidthGroup">
                    <label for="graphicsWidthInput">
                        <span>Width <span class="unit">col</span></span>
                        <input type="text" class="value-display" id="graphicsWidthInput" value="4" data-min="0.25" data-max="200" data-step="0.25" aria-label="Width in columns">
                    </label>
                </div>
                
                <div class="control-group" id="graphicsHeightGroup">
                    <label for="graphicsHeightInput">
                        <span>Height <span class="unit">mod</span></span>
                        <input type="text" class="value-display" id="graphicsHeightInput" value="3" data-min="0.25" data-max="200" data-step="0.25" aria-label="Height in modules">
                    </label>
                </div>
                
                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="graphicsLockPositionToggle" aria-label="Constrain to grid">
                        <span>Constrain to Grid</span>
                    </label>
                </div>
                
                <div class="control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="graphicsAlignRightToggle" aria-label="Align to right edge">
                        <span>Align Right</span>
                    </label>
                </div>
            </section>
        </div>
    </aside>
