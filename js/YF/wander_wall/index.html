<!doctype html>
<html lang="en" data-tool-name="Wander Wall">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Wander Wall - YF Tools</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../infra/framework/css/othersite-styles.css">
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="../infra/framework/css/ui-contract.css?v=uiq-6">
</head>
<body>
<div class="container wander-wall">
    <header class="top-links" aria-label="Tool navigation">
        <a class="top-link back-link" href="../" aria-label="Back to YF Tools">&larr; YF Tools</a>
        <div class="preset-toolbar-cluster">
            <div class="preset-dropdown" id="presetDropdown">
                <button class="preset-dropdown-toggle" id="presetDropdownToggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="presetDropdownMenu"><span class="preset-dropdown-text">Presets</span><svg class="preset-dropdown-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" aria-hidden="true"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <ul class="preset-dropdown-menu" id="presetDropdownMenu" role="listbox"></ul>
            </div>
            <button id="presetToolbarShareBtn" class="preset-toolbar-share-btn" type="button" aria-label="Copy share link" data-tooltip="Copy share link"><svg viewBox="0 0 12 12" width="18" height="18" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M5.741 3.43l.612-.612a2 2 0 0 1 2.829 2.828l-.612.613M6.259 8.57l-.613.612a2 2 0 1 1-2.828-2.828l.612-.613M7.518 4.482L4.482 7.518"/></svg></button>
        </div>
        <button id="savePresetBtn" class="top-link" type="button" style="display:none">Save preset</button>
        <button id="zoomIndicator" class="zoom-indicator" type="button" data-tooltip="Fit to screen" aria-label="Fit canvas to screen">100%</button>
    </header>
    <main class="main-content">
        <h1 class="sr-only">Wander Wall</h1>
        <section class="canvas-container" id="canvasContainer" aria-label="Wallpaper canvas" tabindex="0">
            <canvas id="mainCanvas" role="img" aria-label="Generated letter wallpaper"></canvas>
        </section>
        <aside class="controls-panel" id="generalPanel">
            <div class="panel-header" id="generalPanelHeader"><span>General</span><button class="collapse-icon" type="button" aria-label="Collapse general" data-icon="chevron"></button></div>
            <div class="panel-content">
                    <div class="text-input-wrap"><textarea id="textInput" class="text-input" rows="2" maxlength="96" spellcheck="false" autocapitalize="off" aria-label="Text" aria-describedby="textError letterCount">Wander</textarea><output id="letterCount" for="textInput">6 / 32</output></div>
                    <p id="textError" class="input-error" role="status"></p>
                    <fieldset id="resolutionFieldset">
                        <select class="style-select" id="resolutionSelect" aria-label="Resolution"></select>
                        <div class="dimensions-row" id="customDimensions" hidden><label for="widthInput">Width, px<input id="widthInput" class="text-input" type="text" inputmode="numeric" value="2560" aria-describedby="resolutionError" disabled></label><label for="heightInput">Height, px<input id="heightInput" class="text-input" type="text" inputmode="numeric" value="1440" aria-describedby="resolutionError" disabled></label></div>
                        <p id="resolutionError" class="input-error" role="status"></p>
                    </fieldset>
            </div>
        </aside>
        <aside class="controls-panel" id="compositionPanel">
            <div class="panel-header" id="compositionPanelHeader"><span>Composition</span><button class="collapse-icon" type="button" aria-label="Collapse composition" data-icon="chevron"></button></div>
            <div class="panel-content">
                <fieldset id="compositionFieldset">
                        <div class="control-group"><label for="fillSlider"><span>Fill <span class="unit">%</span></span><input id="fillValue" class="value-display" value="100" inputmode="decimal" aria-label="Fill value"></label><input id="fillSlider" type="range" min="70" max="125" step="1" value="100"></div>
                        <div class="control-group"><label for="rotationRangeSlider" data-tooltip="Random rotation of unpinned layers, from minus to plus this angle"><span>Rotation range <span class="unit">&plusmn;&deg;</span></span><input id="rotationRangeValue" class="value-display" value="24" inputmode="decimal" aria-label="Random rotation range"></label><input id="rotationRangeSlider" type="range" min="0" max="180" step="1" value="24"></div>
                        <div class="control-group"><label for="sizeRangeSlider" data-tooltip="0 keeps default sizes; 100 adds up to 50% smaller or larger sizes"><span>Size range <span class="unit">%</span></span><input id="sizeRangeValue" class="value-display" value="0" inputmode="decimal" aria-label="Random size range"></label><input id="sizeRangeSlider" type="range" min="0" max="100" step="1" value="0"></div>
                        <div class="control-group"><label for="overflowSlider" data-tooltip="Edge overflow for automatic generation only; manual movement is unrestricted"><span>Edge overflow <span class="unit">%</span></span><input id="overflowValue" class="value-display" value="0" inputmode="decimal" aria-label="Edge overflow value"></label><input id="overflowSlider" type="range" min="0" max="50" step="1" value="0"></div>
                        <div class="control-group" id="formsCountGroup"><label for="formCountSlider"><span>Object count</span><input id="formCountValue" class="value-display" value="7" inputmode="numeric" aria-label="Object count value"></label><input id="formCountSlider" type="range" min="0" max="16" step="1" value="7"></div>
                    <div id="effectsControls" class="ui-control-stack"></div>
                </fieldset>
            </div>
        </aside>
        <aside class="controls-panel" id="elementsPanel">
            <div class="panel-header" id="elementsPanelHeader"><span>Layers</span><button class="collapse-icon" type="button" aria-label="Collapse layers" data-icon="chevron"></button></div>
            <div class="panel-content">
                <div class="layer-list" id="elementList" role="list" aria-label="Layers, front to back"></div>
            </div>
        </aside>
        <aside class="controls-panel panel-collapsed" id="backgroundPanel">
            <div class="panel-header" id="backgroundPanelHeader"><span>Background</span><button class="collapse-icon" type="button" aria-label="Expand background" data-icon="chevron"></button></div>
            <div class="panel-content" id="backgroundControls"></div>
        </aside>
    </main>
    <nav class="mobile-panel-tabs" role="tablist" aria-label="Editor panels">
        <button id="generalTab" type="button" role="tab" aria-controls="generalPanel" aria-selected="true" data-panel="general">General</button>
        <button id="compositionTab" type="button" role="tab" aria-controls="compositionPanel" aria-selected="false" data-panel="composition" tabindex="-1">Composition</button>
        <button id="elementsTab" type="button" role="tab" aria-controls="elementsPanel" aria-selected="false" data-panel="elements" tabindex="-1">Layers</button>
        <button id="backgroundTab" type="button" role="tab" aria-controls="backgroundPanel" aria-selected="false" data-panel="background" tabindex="-1">Background</button>
        <button id="sheetToggleBtn" type="button" aria-label="Collapse panels" aria-expanded="true" data-tooltip="Collapse panels" data-icon="chevron"></button>
    </nav>
    <nav class="bottom-buttons action-dock" role="toolbar" aria-label="Tool actions">
        <div class="action-dock__slot action-dock__slot--utility">
            <button id="generateBtn" class="btn-fixed btn-fixed--muted" type="button" disabled>Generate</button>
            <button id="exportJsonBtn" class="btn-fixed btn-fixed--muted" type="button" data-action-dock-extra hidden>Export JSON</button>
            <button id="importJsonBtn" class="btn-fixed btn-fixed--muted" type="button" data-action-dock-extra hidden>Import JSON</button>
        </div>
        <div class="action-dock__slot action-dock__slot--primary"><button id="exportPngBtn" class="btn-fixed" type="button" disabled>PNG</button></div>
        <div class="action-dock__slot action-dock__slot--options"></div>
    </nav>
    <dialog id="variantDialog" class="modal variant-dialog" aria-labelledby="variantDialogTitle"><div class="modal-content"><button id="closeVariantsBtn" type="button" class="modal-close" aria-label="Close variants">&times;</button><h2 id="variantDialogTitle" class="modal-title">Variants</h2><label class="stacked-select-label" for="variantCategory">Category<select id="variantCategory" class="style-select"></select></label><div id="variantGrid" class="variant-grid" role="group" aria-label="Artwork variants"></div></div></dialog>
    <p id="operationStatus" class="operation-status" role="status" aria-live="polite">Loading artwork...</p>
    <button id="retryBtn" class="panel-action retry-button" type="button" hidden>Retry</button>
    <input id="jsonFileInput" type="file" accept=".json,application/json" hidden><button id="jsonPickerTrigger" type="button" hidden>Choose JSON</button>
    <dialog id="dialog" class="modal" aria-labelledby="dialogTitle"><div class="modal-content"><h2 id="dialogTitle" class="modal-title"></h2><div id="dialogText" class="modal-text"></div><input id="dialogInput" class="modal-input" type="text" style="display:none"><div id="dialogButtons" class="modal-buttons"></div></div></dialog>
</div>
<script type="module" src="./tool.js"></script>
</body>
</html>
