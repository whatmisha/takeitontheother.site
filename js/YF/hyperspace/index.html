<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../infra/qa/ui-audit/runtime-probe.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperspace Jump Generator</title>
    <script src="../infra/framework/vendor/p5/1.4.0/lib/p5.js"></script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../infra/framework/css/othersite-styles.css">
    <link rel="stylesheet" href="../infra/framework/css/generator-host.css?v=3">
    <link rel="stylesheet" href="../infra/framework/css/ui-contract.css?v=uiq-5">
</head>
<body>
    <a class="upgrade-migration-preview" href="../" aria-label="YF Tools — return to main page">← YF Tools</a>
    <div class="controls">
        <label for="lineCount">Line count <span id="lineCountValue">200</span></label>
        <input type="range" id="lineCount" min="50" max="500" value="200">
        
        <label for="opacity">Line opacity <span id="opacityValue">80</span>%</label>
        <input type="range" id="opacity" min="10" max="100" value="80">
        
        <label for="fadeLength">Fade length <span id="fadeLengthValue">30</span>%</label>
        <input type="range" id="fadeLength" min="5" max="50" value="30">
        
        <label for="segmentsCount">Gradient quality <span id="segmentsCountValue">10</span></label>
        <input type="range" id="segmentsCount" min="5" max="100" value="10">
        
        <label for="lineWidth">Line width <span id="lineWidthValue">2</span></label>
        <input type="range" id="lineWidth" min="1" max="15" value="2" step="0.5">
        
        <label for="widthGrowth">Width growth <span id="widthGrowthValue">0</span></label>
        <input type="range" id="widthGrowth" min="0" max="100" value="25" step="1">
        
        <label for="circleRadius">Vanish radius <span id="circleRadiusValue">2.0</span></label>
        <input type="range" id="circleRadius" min="1.1" max="3.0" value="2.0" step="0.1">
        
        <label for="speed">Speed <span id="speedValue">3</span></label>
        <input type="range" id="speed" min="1" max="10" value="3">
        
        <div class="checkbox-container">
            <input type="checkbox" id="reverseWedge">
            <label for="reverseWedge">Reverse taper</label>
        </div>
        
        <div class="color-controls">
            <div class="color-picker">
                <label for="startColor">Color 1</label>
                <div class="color-input-group">
                    <input type="color" id="startColor" value="#2353DB">
                    <input type="text" id="startColorHex" value="#2353DB" placeholder="HEX" class="hex-input">
                </div>
            </div>
            <div class="color-picker">
                <label for="midColor">Color 2</label>
                <div class="color-input-group">
                    <input type="color" id="midColor" value="#23DBD3">
                    <input type="text" id="midColorHex" value="#23DBD3" placeholder="HEX" class="hex-input">
                </div>
            </div>
            <div class="color-picker">
                <label for="endColor">Color 3</label>
                <div class="color-input-group">
                    <input type="color" id="endColor" value="#5723DB">
                    <input type="text" id="endColorHex" value="#5723DB" placeholder="HEX" class="hex-input">
                </div>
            </div>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" id="useColorGradient">
            <label for="useColorGradient">Color gradient</label>
        </div>
        
        <div class="button-container">
            <button id="centerButton" class="control-button">Center</button>
            <button id="pauseButton" type="button">Pause / resume</button>
            <button id="exportButton" class="control-button">PNG</button>
        </div>
        
    </div>
    <script src="sketch.js?v=integration-9&layout=root-infra-1"></script>
</body>
</html>
