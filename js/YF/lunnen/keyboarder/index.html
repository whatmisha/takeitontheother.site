<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keyboarder</title>
    <link rel="stylesheet" href="vendor/framework/css/othersite-styles.css">
    <link rel="stylesheet" href="app/theme.css">
</head>
<body>
<div class="container">

    <div class="top-links">
        <span class="top-link top-link--static">Keyboarder</span>

        <div class="preset-toolbar-cluster">
            <div class="preset-dropdown" id="presetDropdown">
                <button class="preset-dropdown-toggle" id="presetDropdownToggle" type="button"
                        aria-haspopup="listbox" aria-expanded="false" aria-controls="presetDropdownMenu">
                    <span class="preset-dropdown-text">Presets</span>
                    <svg class="preset-dropdown-arrow" width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <ul class="preset-dropdown-menu" id="presetDropdownMenu" role="listbox"></ul>
            </div>
            <button type="button" id="presetToolbarShareBtn" class="preset-toolbar-share-btn"
                    aria-label="Copy share link" data-tooltip="Copy share link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="18" height="18" fill="none" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M5.7410987,3.4304742l.6124561-.6124561c.7810478-.7810478,2.0473765-.7810478,2.8284243,0l.0000028.0000028c.7810478.7810478.7810478,2.0473765,0,2.8284243l-.6124561.6124561"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M6.2589013,8.5695258l-.6124561.6124561c-.7810478.7810478-2.0473765.7810478-2.8284243,0l-.0000028-.0000028c-.7810478-.7810478-.7810478-2.0473765,0-2.8284243l.6124561-.6124561"/><line x1="7.5184826" y1="4.4815174" x2="4.4815174" y2="7.5184826" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"/></svg>
            </button>
        </div>

        <button class="top-link" id="savePresetBtn" type="button" style="display:none;">Save preset</button>

        <div class="zoom-indicator" id="zoomIndicator" data-tooltip="Click to fit to screen">100%</div>
    </div>

    <main class="main-content" id="mainContent">
        <h1 class="sr-only">Keyboarder</h1>

        <div class="canvas-container" id="canvasContainer">
            <svg id="mainSvg" role="img" aria-label="Keyboard layout"></svg>
        </div>

        <!-- GRID -->
        <aside class="controls-panel controls-panel-left" id="gridPanel">
            <div class="panel-header" id="gridPanelHeader">
                <span>Grid</span>
                <span class="collapse-icon">
                    <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="panel-content">
                <section class="control-section">
                    <div class="control-group">
                        <label for="colPitchSlider"><span>Column pitch</span>
                            <input type="text" class="value-display" id="colPitchValue" inputmode="decimal" aria-label="Column pitch, mm"></label>
                        <input type="range" id="colPitchSlider" min="10" max="28" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="rowPitchSlider"><span>Row pitch</span>
                            <input type="text" class="value-display" id="rowPitchValue" inputmode="decimal" aria-label="Row pitch, mm"></label>
                        <input type="range" id="rowPitchSlider" min="10" max="28" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="keyWidthSlider"><span>1U width</span>
                            <input type="text" class="value-display" id="keyWidthValue" inputmode="decimal" aria-label="1U width, mm"></label>
                        <input type="range" id="keyWidthSlider" min="7" max="26" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="keyHeightSlider"><span>Key height</span>
                            <input type="text" class="value-display" id="keyHeightValue" inputmode="decimal" aria-label="Key height, mm"></label>
                        <input type="range" id="keyHeightSlider" min="7" max="26" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="radiusSlider"><span>Corner radius</span>
                            <input type="text" class="value-display" id="radiusValue" inputmode="decimal" aria-label="Corner radius, mm"></label>
                        <input type="range" id="radiusSlider" min="0" max="7" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="insetSlider"><span>Guide inset</span>
                            <input type="text" class="value-display" id="insetValue" inputmode="decimal" aria-label="Guide inset, mm"></label>
                        <input type="range" id="insetSlider" min="0" max="6.5" step="0.001">
                    </div>

                    <div class="control-group pill-toggle-row">
                        <button type="button" class="btn-inline" id="resetGridBtn"
                                data-tooltip="Restore values measured from the drawing">Reference grid</button>
                    </div>

                    <dl class="readout" id="statsReadout">
                        <div><dt>Keys</dt><dd id="statKeys">—</dd></div>
                        <div><dt>Artboard</dt><dd id="statBoard">—</dd></div>
                        <div><dt>Gap</dt><dd id="statGap">—</dd></div>
                        <div><dt>Legends</dt><dd id="statLegends">—</dd></div>
                    </dl>
                </section>
            </div>
        </aside>

        <!-- TYPE -->
        <aside class="controls-panel controls-panel-type" id="typePanel">
            <div class="panel-header" id="typePanelHeader">
                <span>Type</span>
                <span class="collapse-icon">
                    <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="panel-content">
                <section class="control-section">
                    <div class="control-group">
                        <label for="glyphSizeSlider"><span>Glyph size</span>
                            <input type="text" class="value-display" id="glyphSizeValue" inputmode="decimal" aria-label="Glyph size, pt"></label>
                        <input type="range" id="glyphSizeSlider" min="6" max="24" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="numpadSizeSlider"><span>Numpad size</span>
                            <input type="text" class="value-display" id="numpadSizeValue" inputmode="decimal" aria-label="Numpad size, pt"></label>
                        <input type="range" id="numpadSizeSlider" min="6" max="24" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="secondarySizeSlider"><span>Secondary size</span>
                            <input type="text" class="value-display" id="secondarySizeValue" inputmode="decimal" aria-label="Secondary size, pt"></label>
                        <input type="range" id="secondarySizeSlider" min="6" max="24" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="wordSizeSlider"><span>Word size</span>
                            <input type="text" class="value-display" id="wordSizeValue" inputmode="decimal" aria-label="Word size, pt"></label>
                        <input type="range" id="wordSizeSlider" min="5" max="18" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="leadingSlider"><span>Leading</span>
                            <input type="text" class="value-display" id="leadingValue" inputmode="decimal" aria-label="Leading, pt"></label>
                        <input type="range" id="leadingSlider" min="6" max="24" step="0.001">
                    </div>
                    <div class="control-group">
                        <label for="trackingOffsetSlider"><span>Tracking offset</span>
                            <input type="text" class="value-display" id="trackingOffsetValue" inputmode="decimal" aria-label="Tracking offset, em"></label>
                        <input type="range" id="trackingOffsetSlider" min="-0.08" max="0.08" step="0.001">
                    </div>
                    <div class="control-group">
                        <div class="segmented-control" id="compModeGroup" role="group" aria-label="Compensation mode">
                            <button type="button" data-mode="off" aria-pressed="false">Off</button>
                            <button type="button" data-mode="model" aria-pressed="false">Model</button>
                            <button type="button" data-mode="table" aria-pressed="true">Model + table</button>
                        </div>
                    </div>
                    <div class="control-group pill-toggle-row">
                        <button type="button" class="btn-inline" id="resetTypeBtn"
                                data-tooltip="Restore measured type settings">Reference type</button>
                    </div>
                </section>
            </div>
        </aside>

        <!-- LAYERS -->
        <aside class="controls-panel" id="layersPanel">
            <div class="panel-header" id="layersPanelHeader">
                <span>Layers</span>
                <span class="collapse-icon">
                    <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="panel-content">
                <section class="control-section">
                    <div class="control-group pill-toggle-row">
                        <label class="pill-toggle" for="showCaps" data-tooltip="Key outlines">
                            <input type="checkbox" id="showCaps" class="sr-only" data-setting="showCaps"><span>Keys</span>
                        </label>
                        <label class="pill-toggle" for="showGlyphs" data-tooltip="Labels as TTF outlines, with optical compensation">
                            <input type="checkbox" id="showGlyphs" class="sr-only" data-setting="showGlyphs"><span>Legends</span>
                        </label>
                        <label class="pill-toggle" for="showIcons" data-tooltip="Icons from the library">
                            <input type="checkbox" id="showIcons" class="sr-only" data-setting="showIcons"><span>Icons</span>
                        </label>
                        <label class="pill-toggle" for="showGuides" data-tooltip="Safety guides — coordinate system for legends">
                            <input type="checkbox" id="showGuides" class="sr-only" data-setting="showGuides"><span>Guides</span>
                        </label>
                        <label class="pill-toggle" for="showColumns" data-tooltip="Grid columns">
                            <input type="checkbox" id="showColumns" class="sr-only" data-setting="showColumns"><span>Columns</span>
                        </label>
                        <label class="pill-toggle" for="showIndex" data-tooltip="Row index and width in U">
                            <input type="checkbox" id="showIndex" class="sr-only" data-setting="showIndex"><span>Index</span>
                        </label>
                        <label class="pill-toggle" for="showInk" data-tooltip="Ink bounds of labels — shows how compensation works">
                            <input type="checkbox" id="showInk" class="sr-only" data-setting="showInk"><span>Ink boxes</span>
                        </label>
                        <label class="pill-toggle" for="showSlots" data-tooltip="Slot code on every element">
                            <input type="checkbox" id="showSlots" class="sr-only" data-setting="showSlots"><span>Slots</span>
                        </label>
                        <label class="pill-toggle" for="showRef" data-tooltip="LCAKB23 reference as underlay">
                            <input type="checkbox" id="showRef" class="sr-only" data-setting="showRef"><span>Reference</span>
                        </label>
                        <label class="pill-toggle" for="showDiff" data-tooltip="Geometry diff against LCAKB23 reference">
                            <input type="checkbox" id="showDiff" class="sr-only" data-setting="showDiff"><span>Diff</span>
                        </label>
                        <label class="pill-toggle" for="showBlocks" data-tooltip="Boundaries of main / nav / numpad blocks">
                            <input type="checkbox" id="showBlocks" class="sr-only" data-setting="showBlocks"><span>Blocks</span>
                        </label>
                    </div>
                </section>
            </div>
        </aside>

        <!-- LEGEND -->
        <aside class="controls-panel controls-panel-legend panel-collapsed" id="legendPanel">
            <div class="panel-header" id="legendPanelHeader">
                <span>Legend</span>
                <span class="collapse-icon collapsed">
                    <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="panel-content">
                <section class="control-section">
                    <div class="control-group">
                        <label for="legendKeySelect"><span>Key</span></label>
                        <select id="legendKeySelect" class="select-control" aria-label="Selected key"></select>
                    </div>
                    <div id="legendInspector" class="legend-inspector"></div>
                </section>
            </div>
        </aside>

        <!-- COLORS -->
        <aside class="controls-panel controls-panel-text panel-collapsed" id="colorsPanel">
            <div class="panel-header" id="colorsPanelHeader">
                <span>Colors</span>
                <span class="collapse-icon collapsed">
                    <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </div>
            <div class="panel-content">
                <section class="control-section">
                    <div class="control-group">
                        <div class="color-swatches-compact" id="colorPickersGroup">
                            <div class="color-swatch-row">
                                <div class="color-swatch-compact" id="capColorItem" data-color-type="cap">
                                    <button type="button" class="color-dot color-dot--expandable" id="capColorPreview" aria-label="Key color"></button>
                                    <span class="color-label">Key</span>
                                    <input type="text" class="color-swatch-hex" id="capColorHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Key color hex">
                                </div>
                                <div class="color-hsb-slot" id="capColorHsbSlot">
                                    <div id="unifiedColorPickerContainer"></div>
                                </div>
                            </div>
                            <div class="color-swatch-row">
                                <div class="color-swatch-compact" id="guideColorItem" data-color-type="guide">
                                    <button type="button" class="color-dot color-dot--expandable" id="guideColorPreview" aria-label="Guide color"></button>
                                    <span class="color-label">Guide</span>
                                    <input type="text" class="color-swatch-hex" id="guideColorHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Guide color hex">
                                </div>
                                <div class="color-hsb-slot" id="guideColorHsbSlot"></div>
                            </div>
                            <div class="color-swatch-row">
                                <div class="color-swatch-compact" id="inkColorItem" data-color-type="ink">
                                    <button type="button" class="color-dot color-dot--expandable" id="inkColorPreview" aria-label="Legend color"></button>
                                    <span class="color-label">Legend</span>
                                    <input type="text" class="color-swatch-hex" id="inkColorHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Legend color hex">
                                </div>
                                <div class="color-hsb-slot" id="inkColorHsbSlot"></div>
                            </div>
                            <div class="color-swatch-row">
                                <div class="color-swatch-compact" id="bgColorItem" data-color-type="bg">
                                    <button type="button" class="color-dot color-dot--expandable" id="bgColorPreview" aria-label="Background color"></button>
                                    <span class="color-label">Background</span>
                                    <input type="text" class="color-swatch-hex" id="bgColorHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Background color hex">
                                </div>
                                <div class="color-hsb-slot" id="bgColorHsbSlot"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </aside>
    </main>

    <nav class="bottom-buttons">
        <button class="btn-fixed btn-intro-help" id="aboutBtn" type="button" aria-label="About" data-tooltip="About">?</button>
        <button class="btn-fixed" id="verifyBtn" type="button" data-tooltip="Compare geometry to the reference">Verify</button>
        <button class="btn-fixed" id="exportPngBtn" type="button">PNG</button>
        <button class="btn-fixed" id="exportSvgBtn" type="button">SVG ⌘E</button>
    </nav>

    <dialog id="dialog" class="modal">
        <div class="modal-content">
            <h2 id="dialogTitle" class="modal-title"></h2>
            <div id="dialogText" class="modal-text"></div>
            <input id="dialogInput" class="modal-input" type="text" style="display:none;">
            <div id="dialogButtons" class="modal-buttons"></div>
        </div>
    </dialog>
</div>

<script type="module" src="app/tool.js"></script>
</body>
</html>
