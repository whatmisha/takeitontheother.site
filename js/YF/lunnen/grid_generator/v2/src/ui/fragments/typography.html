                <div class="control-group">
                    <label for="headlineStyleDropdown">
                        <select id="headlineStyleDropdown" class="style-select" aria-label="Select font weight">
                            <option value="500">Medium</option>
                            <option value="400">Regular</option>
                        </select>
                    </label>
                </div>
                
                <div class="control-group">
                    <label for="headlineSizeSlider">

                                <button type="button" class="unit-btn" data-unit="pt" id="headlineSizeUnitPt">pt</button>

                        <input type="checkbox" id="useXHeight" checked aria-label="Use x-height for measurement">
