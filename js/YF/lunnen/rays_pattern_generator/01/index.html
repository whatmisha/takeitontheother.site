<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Pattern Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <canvas id="patternCanvas" width="3000" height="1000" style="width: 100%; height: auto;"></canvas>
        
        <div class="controls-wrapper">
            <!-- Первая строка с основными настройками -->
            <div class="controls main-controls">
                <div class="control-group">
                    <label for="lineWidthSlider">Line Thickness: <span id="lineWidthValue">2</span> px</label>
                    <input type="range" id="lineWidthSlider" min="1" max="24" value="2" step="0.5">
                </div>
                
                <div class="control-group">
                    <label for="gapSlider">Center Offset: <span id="gapValue">19</span> px</label>
                    <input type="range" id="gapSlider" min="0" max="50" value="19" step="1">
                </div>
                
                <div class="control-group">
                    <label for="rayLengthSlider">Ray Length: <span id="rayLengthValue">56</span> px</label>
                    <input type="range" id="rayLengthSlider" min="10" max="200" value="56" step="1">
                </div>
                
                <div class="control-group">
                    <label for="rayCountSlider">Ray Count: <span id="rayCountValue">5</span></label>
                    <input type="range" id="rayCountSlider" min="3" max="24" value="5" step="1" list="rayCountValues">
                    <datalist id="rayCountValues">
                        <option value="3"></option>
                        <option value="4"></option>
                        <option value="5"></option>
                        <option value="6"></option>
                        <option value="8"></option>
                        <option value="10"></option>
                        <option value="12"></option>
                        <option value="14"></option>
                        <option value="16"></option>
                        <option value="18"></option>
                        <option value="20"></option>
                        <option value="24"></option>
                    </datalist>
                </div>
                
                <div class="control-group">
                    <label for="scaleSlider">Scale: <span id="scaleValue">1.0</span>×</label>
                    <input type="range" id="scaleSlider" min="0.2" max="3" value="1" step="0.1">
                </div>
            </div>
            
            <!-- Вторая строка с настройками растра -->
            <div class="controls raster-controls-row">
                <div class="raster-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rasterModeCheckbox">
                        <span class="checkbox-text">Raster Gradient</span>
                    </label>
                </div>
                
                <div class="raster-sliders">
                    <div class="control-group raster-control">
                        <label for="gradientIntensitySlider">Raster Intensity: <span id="gradientIntensityValue">50</span>%</label>
                        <input type="range" id="gradientIntensitySlider" min="0" max="100" value="50" step="1">
                    </div>
                    
                    <div class="control-group raster-control">
                        <label for="leftBrightnessSlider">Left Opacity: <span id="leftBrightnessValue">30</span>%</label>
                        <input type="range" id="leftBrightnessSlider" min="10" max="100" value="30" step="1">
                    </div>
                    
                    <div class="control-group raster-control">
                        <label for="rightDarknessSlider">Right Darkness: <span id="rightDarknessValue">170</span>%</label>
                        <input type="range" id="rightDarknessSlider" min="100" max="200" value="170" step="1">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="button-container">
            <button id="resetBtn" class="reset-btn">Reset</button>
            <button id="exportSvgBtn" class="export-btn">Export SVG (⌘E)</button>
        </div>
        
        <div class="checkbox-container">
            <label class="checkbox-label">
                <input type="checkbox" id="roundCapCheckbox">
                <span class="checkbox-text">Round Line Caps</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="offsetRowsCheckbox">
                <span class="checkbox-text">Chess Mode</span>
            </label>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
