<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Pattern Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <canvas id="patternCanvas" width="3000" height="1000"></canvas>
        
        <div class="controls-wrapper">
            <!-- Первая строка с основными настройками -->
            <div class="controls main-controls-row">
                <div class="pattern-checkbox control-group">
                    <label class="checkbox-label" style="margin-left: 0; padding-left: 0;">
                        <span class="checkbox-text" style="margin-left: 0; padding-left: 0;">Pattern Settings</span>
                    </label>
                </div>
                
                <div class="pattern-sliders">
                    <div class="control-group">
                        <label for="rayLengthSlider">Line Length<span class="colon">:</span> <span id="rayLengthValue">56</span> <span class="unit">px</span></label>
                        <input type="range" id="rayLengthSlider" min="10" max="200" value="56" step="1">
                    </div>
                    
                    <div class="control-group">
                        <label for="lineWidthSlider">Line Width<span class="colon">:</span> <span id="lineWidthValue">2</span> <span class="unit">px</span></label>
                        <input type="range" id="lineWidthSlider" min="1" max="24" value="2" step="0.5">
                    </div>
                    
                    <div class="control-group">
                        <label for="gapSlider">Center Offset<span class="colon">:</span> <span id="gapValue">19</span> <span class="unit">px</span></label>
                        <input type="range" id="gapSlider" min="0" max="50" value="19" step="1">
                    </div>
                    
                    <div class="control-group">
                        <label for="rayCountSlider">Line Count<span class="colon">:</span> <span id="rayCountValue">5</span></label>
                        <input type="range" id="rayCountSlider" min="3" max="24" value="5" step="1" list="rayCountValues">
                        <datalist id="rayCountValues">
                            <option value="3"></option>
                            <option value="4"></option>
                            <option value="5"></option>
                            <option value="6"></option>
                            <option value="8"></option>
                            <option value="10"></option>
                            <option value="12"></option>
                            <option value="14"></option>
                            <option value="16"></option>
                            <option value="18"></option>
                            <option value="20"></option>
                            <option value="24"></option>
                        </datalist>
                    </div>
                    
                    <div class="control-group">
                        <label for="scaleSlider">Scale<span class="colon">:</span> <span id="scaleValue">1.0</span></label>
                        <input type="range" id="scaleSlider" min="0.1" max="3" value="1.0" step="0.1">
                    </div>
                    
                    <!-- Горизонтальное расстояние между модулями -->
                    <div class="control-group">
                        <label for="horizontalGapSlider">Horizontal Gap<span class="colon">:</span> <span id="horizontalGapValue">20</span> <span class="unit">px</span></label>
                        <input type="range" id="horizontalGapSlider" min="0" max="100" value="20" step="1">
                    </div>
                    
                    <!-- Вертикальное расстояние между модулями -->
                    <div class="control-group">
                        <label for="verticalGapSlider">Vertical Gap<span class="colon">:</span> <span id="verticalGapValue">10</span> <span class="unit">px</span></label>
                        <input type="range" id="verticalGapSlider" min="0" max="100" value="10" step="1">
                    </div>
                </div>
            </div>
            
            <!-- Вторая строка с настройками растра -->
            <div class="controls raster-controls-row">
                <div class="raster-checkboxes">
                <div class="raster-checkbox control-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rasterModeCheckbox">
                        <span class="checkbox-text">Raster Gradient</span>
                    </label>
                    </div>
                    
                    <div class="raster-checkbox control-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="imageRasterModeCheckbox">
                            <span class="checkbox-text">Image Raster</span>
                        </label>
                    </div>
                </div>
                
                <div class="raster-sliders">
                        <div class="control-group">
                        <label for="zeroRayLengthSlider">Highlights Length<span class="colon">:</span> <span id="zeroRayLengthValue">30</span> <span class="unit">px</span></label>
                            <input type="range" id="zeroRayLengthSlider" min="0" max="200" value="30">
                        </div>
                    
                    <div class="control-group">
                        <label for="zeroLineWidthSlider">Highlights Width<span class="colon">:</span> <span id="zeroLineWidthValue">1.0</span> <span class="unit">px</span></label>
                        <input type="range" id="zeroLineWidthSlider" min="1" max="24" step="0.5" value="1.0">
                    </div>
                    
                        <div class="control-group">
                        <label for="hundredRayLengthSlider">Shadows Length<span class="colon">:</span> <span id="hundredRayLengthValue">100</span> <span class="unit">px</span></label>
                            <input type="range" id="hundredRayLengthSlider" min="0" max="200" value="100">
                        </div>
                    
                    <div class="control-group">
                        <label for="hundredLineWidthSlider">Shadows Width<span class="colon">:</span> <span id="hundredLineWidthValue">2.0</span> <span class="unit">px</span></label>
                        <input type="range" id="hundredLineWidthSlider" min="1" max="24" step="0.5" value="2.0">
                    </div>
                </div>
            </div>
            
            <!-- Секция для загрузки изображения -->
            <div id="imageRasterControls" class="controls image-raster-controls-row" style="display: none;">
                <div class="image-upload-container">
                    <label for="imageUpload" class="image-upload-label">Upload Image</label>
                    <input type="file" id="imageUpload" accept="image/*" class="image-upload-input">
                    <div class="image-preview-container">
                        <img id="imagePreview" class="image-preview" src="#" alt="Preview" style="display: none;">
                    </div>
                </div>
                <div class="image-settings">
                        <div class="control-group">
                        <label for="brightnessContrastSlider">Contrast<span class="colon">:</span> <span id="brightnessContrastValue">1.0</span></label>
                        <input type="range" id="brightnessContrastSlider" min="0.1" max="3" value="1" step="0.1">
                        </div>
                        <div class="control-group">
                        <label for="imageInvertCheckbox" class="checkbox-label">
                            <input type="checkbox" id="imageInvertCheckbox">
                            <span class="checkbox-text">Invert Brightness</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="control-buttons-container">
        <div class="checkboxes-section">
            <label class="checkbox-label">
                <input type="checkbox" id="offsetRowsCheckbox">
                <span class="checkbox-text">Classic Mode</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="roundCapCheckbox">
                <span class="checkbox-text">Round Line Caps</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="hideConnectingLinesCheckbox">
                <span class="checkbox-text">Hide Dividers</span>
            </label>
        </div>
        
        <div class="settings-recovery-section">
            <input type="text" id="settingsInput" placeholder="Paste filename to restore settings" class="settings-input" autocomplete="off" spellcheck="false">
            <button id="restoreSettingsBtn" class="restore-btn">Restore</button>
        </div>
        
        <div class="buttons-section">
            <button id="resetBtn" class="reset-btn">Reset</button>
            <button id="exportSvgBtn" class="export-btn">Export SVG (⌘E)</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
