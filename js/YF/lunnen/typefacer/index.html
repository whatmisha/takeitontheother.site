<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halftone Generator — Lunnen Display</title>
    <link rel="stylesheet" href="css/yf-styles.css">
    <style>
        /* ── Format grid ── */
        .format-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }
        .format-grid label {
            flex: 1; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 7px 4px; margin: 0;
            font-size: 0.8rem; line-height: 1; color: var(--color-text-secondary);
            background: var(--color-bg-input); border-radius: calc(var(--radius-input) - 2px);
            cursor: pointer; transition: all var(--transition-normal);
            user-select: none; font-weight: 400;
        }
        .format-grid label:hover { color: var(--color-text); }
        .format-grid input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
        .format-grid input[type="radio"]:checked + label {
            background: var(--color-text); color: var(--color-bg); font-weight: 500;
        }
        .custom-format-row {
            display: flex; gap: 8px; margin-top: 8px; align-items: center;
        }
        .custom-format-row input {
            flex: 1; height: 28px; background: var(--color-bg-input);
            border: 1px solid var(--color-border); color: var(--color-text);
            font-family: inherit; font-size: 0.85rem; padding: 0 8px;
            border-radius: var(--radius-input); text-align: center;
        }
        .custom-format-row input:focus { outline: none; border-color: var(--color-text-dim); }
        .custom-format-row span { color: var(--color-text-dim); font-size: 0.8rem; flex-shrink: 0; }

        /* ── Pattern text input ── */
        .pattern-text-input {
            width: 100%; height: 32px; background: var(--color-bg-input);
            border: 1px solid var(--color-border); color: var(--color-text);
            font-family: 'Lunnen Display', sans-serif; font-size: 1.1rem;
            font-weight: 300; padding: 0 10px; border-radius: var(--radius-input);
            letter-spacing: 2px; transition: border-color var(--transition-normal);
        }
        .pattern-text-input:focus { outline: none; border-color: var(--color-text-dim); }
        .pattern-text-input::placeholder { color: var(--color-text-muted); font-family: inherit; letter-spacing: 0; }

        /* ── Image upload ── */
        .image-upload-compact {
            display: flex; align-items: center; gap: 8px; margin-top: 8px;
            padding: 10px 12px; border: 1px dashed var(--color-border);
            border-radius: var(--radius-input); cursor: pointer;
            transition: border-color var(--transition-normal), background var(--transition-normal);
        }
        .image-upload-compact:hover { border-color: var(--color-text-dim); background: rgba(255,255,255,0.02); }
        .image-upload-compact.dragover { border-color: var(--color-text); background: rgba(255,255,255,0.05); }
        .image-upload-icon { color: var(--color-text-dim); flex-shrink: 0; }
        .image-upload-info { flex: 1; min-width: 0; }
        .image-upload-name { font-size: 0.8rem; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .image-upload-hint { font-size: 0.7rem; color: var(--color-text-muted); margin-top: 1px; }
        .image-remove-btn {
            background: transparent; border: none; color: var(--color-text-muted);
            cursor: pointer; padding: 2px; display: flex; align-items: center;
            transition: color var(--transition-fast); flex-shrink: 0;
        }
        .image-remove-btn:hover { color: var(--color-text); }

        /* ── Generator mode select ── */
        .generator-mode-select {
            width: 100%; padding: 6px 12px; background: #2a2a2a; border: none;
            color: var(--color-text); font-family: inherit; font-size: 0.85rem;
            border-radius: var(--radius-input); cursor: pointer;
            transition: background var(--transition-normal); height: 32px;
        }
        .generator-mode-select:hover { background: #333; }
        .generator-mode-select:focus { outline: none; background: #333; }
        .generator-mode-select option { background: #2a2a2a; color: var(--color-text); }

        /* ── Compact segmented for 4 items ── */
        .segmented-control-compact label { padding: 8px 2px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">

        <!-- Top Links -->
        <div class="top-links">
            <a href="/js/YF/" class="yf-tools-link">← YF Tools</a>
            <button class="zoom-indicator" id="zoomIndicator" type="button" aria-label="Reset zoom">100%</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Canvas -->
            <div class="canvas-container" id="canvasContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>

            <!-- ============================================ -->
            <!-- LEFT PANEL — General                         -->
            <!-- ============================================ -->
            <aside class="controls-panel controls-panel-left" id="generalPanel" aria-label="General panel">
                <div class="panel-header" id="generalPanelHeader">
                    <span>General</span>
                    <span class="collapse-icon" role="button" aria-label="Collapse panel" tabindex="0">
                        <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="panel-content">

                    <!-- Text -->
                    <section class="control-section">
                        <h3>Text</h3>
                        <div class="control-group">
                            <input type="text" class="pattern-text-input" id="patternTextInput" value="A" placeholder="A" autocomplete="off" spellcheck="false">
                        </div>
                    </section>

                    <!-- Background Color -->
                    <section class="control-section">
                        <h3>Background</h3>
                        <div class="control-group">
                            <div class="color-input-group">
                                <button type="button" class="color-preview" id="bgColorPreview" aria-label="Toggle background color picker"></button>
                                <input type="text" class="hex-color-input" id="bgHexColorInput" value="#000000" maxlength="7" aria-label="Background hex color">
                            </div>
                        </div>
                        <div class="hsb-picker" id="bgHsbPicker" style="display: none;">
                            <div class="hsb-controls">
                                <div class="hsb-control-group">
                                    <label for="bgHueSlider"><span>Hue</span><input type="text" class="value-display hsb-value" id="bgHueValue" value="0"></label>
                                    <input type="range" id="bgHueSlider" min="0" max="360" step="1" value="0">
                                </div>
                                <div class="hsb-control-group">
                                    <label for="bgSaturationSlider"><span>Saturation</span><input type="text" class="value-display hsb-value" id="bgSaturationValue" value="0"></label>
                                    <input type="range" id="bgSaturationSlider" min="0" max="100" step="1" value="0">
                                </div>
                                <div class="hsb-control-group">
                                    <label for="bgBrightnessSlider"><span>Brightness</span><input type="text" class="value-display hsb-value" id="bgBrightnessValue" value="0"></label>
                                    <input type="range" id="bgBrightnessSlider" min="0" max="100" step="1" value="0">
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Text Color -->
                    <section class="control-section">
                        <h3>Text Color</h3>
                        <div class="control-group">
                            <div class="color-input-group">
                                <button type="button" class="color-preview" id="textColorPreview" aria-label="Toggle text color picker"></button>
                                <input type="text" class="hex-color-input" id="textHexColorInput" value="#FFFFFF" maxlength="7" aria-label="Text hex color">
                            </div>
                        </div>
                        <div class="hsb-picker" id="textHsbPicker" style="display: none;">
                            <div class="hsb-controls">
                                <div class="hsb-control-group">
                                    <label for="textHueSlider"><span>Hue</span><input type="text" class="value-display hsb-value" id="textHueValue" value="0"></label>
                                    <input type="range" id="textHueSlider" min="0" max="360" step="1" value="0">
                                </div>
                                <div class="hsb-control-group">
                                    <label for="textSaturationSlider"><span>Saturation</span><input type="text" class="value-display hsb-value" id="textSaturationValue" value="0"></label>
                                    <input type="range" id="textSaturationSlider" min="0" max="100" step="1" value="0">
                                </div>
                                <div class="hsb-control-group">
                                    <label for="textBrightnessSlider"><span>Brightness</span><input type="text" class="value-display hsb-value" id="textBrightnessValue" value="100"></label>
                                    <input type="range" id="textBrightnessSlider" min="0" max="100" step="1" value="100">
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Format -->
                    <section class="control-section">
                        <h3>Format</h3>
                        <div class="control-group">
                            <fieldset>
                                <legend class="sr-only">Artboard format</legend>
                                <div class="format-grid">
                                    <input type="radio" name="format" value="1080×1920" id="fmt1080x1920" checked>
                                    <label for="fmt1080x1920">1080 × 1920</label>
                                    <input type="radio" name="format" value="1080×1080" id="fmt1080x1080">
                                    <label for="fmt1080x1080">1080 × 1080</label>
                                    <input type="radio" name="format" value="1080×1440" id="fmt1080x1440">
                                    <label for="fmt1080x1440">1080 × 1440</label>
                                    <input type="radio" name="format" value="1920×1080" id="fmt1920x1080">
                                    <label for="fmt1920x1080">1920 × 1080</label>
                                    <input type="radio" name="format" value="custom" id="fmtCustom">
                                    <label for="fmtCustom">Custom</label>
                                </div>
                            </fieldset>
                        </div>
                        <div class="control-group custom-format-row" id="customFormatGroup" style="display:none">
                            <input type="number" id="customWidthInput" value="1080" min="100" max="7680" placeholder="W">
                            <span>×</span>
                            <input type="number" id="customHeightInput" value="1920" min="100" max="7680" placeholder="H">
                        </div>
                    </section>

                </div>
            </aside>

            <!-- ============================================ -->
            <!-- RIGHT PANEL — Style                          -->
            <!-- ============================================ -->
            <aside class="controls-panel" id="stylePanel" aria-label="Style panel">
                <div class="panel-header" id="stylePanelHeader">
                    <span>Style</span>
                    <span class="collapse-icon" role="button" aria-label="Collapse panel" tabindex="0">
                        <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="panel-content">

                    <!-- Generator mode -->
                    <section class="control-section">
                        <div class="control-group">
                            <select id="generatorModeSelect" class="generator-mode-select" aria-label="Generator mode">
                                <option value="halftone" selected>Halftone</option>
                                <option value="concentric">Concentric</option>
                            </select>
                        </div>
                    </section>

                    <!-- Halftone controls -->
                    <div id="halftoneControls">

                        <section class="control-section">
                            <h3>Pattern</h3>

                            <div class="control-group">
                                <fieldset>
                                    <legend class="sr-only">Render mode</legend>
                                    <div class="segmented-control segmented-control-compact">
                                        <input type="radio" name="renderMode" value="size" id="modeSize" checked>
                                        <label for="modeSize">Size</label>
                                        <input type="radio" name="renderMode" value="weight" id="modeWeight">
                                        <label for="modeWeight">Weight</label>
                                        <input type="radio" name="renderMode" value="combined" id="modeCombined">
                                        <label for="modeCombined">Both</label>
                                        <input type="radio" name="renderMode" value="uniform" id="modeUniform">
                                        <label for="modeUniform">Uniform</label>
                                    </div>
                                </fieldset>
                            </div>

                            <div class="control-group">
                                <label for="resolutionSlider">
                                    <span>Resolution</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="resolutionValue" value="30">
                                    </div>
                                </label>
                                <input type="range" id="resolutionSlider" min="5" max="120" step="1" value="30">
                            </div>

                            <div class="control-group">
                                <label for="spacingSlider">
                                    <span>Spacing</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="spacingValue" value="1.00">
                                    </div>
                                </label>
                                <input type="range" id="spacingSlider" min="0.30" max="3.00" step="0.05" value="1.00">
                            </div>

                            <div class="control-group">
                                <label for="contrastSlider">
                                    <span>Contrast</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="contrastValue" value="70">
                                    </div>
                                </label>
                                <input type="range" id="contrastSlider" min="0" max="100" step="1" value="70">
                            </div>

                            <div class="control-group" id="fontWeightGroup">
                                <label for="fontWeightSlider">
                                    <span>Weight</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="fontWeightValue" value="200">
                                    </div>
                                </label>
                                <input type="range" id="fontWeightSlider" min="100" max="400" step="1" value="200">
                            </div>
                        </section>

                        <!-- Source Image -->
                        <section class="control-section">
                            <h3>Source Image</h3>
                            <div class="control-group">
                                <div class="image-upload-compact" id="imageUploadArea">
                                    <svg class="image-upload-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <rect x="2" y="2" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
                                        <circle cx="7" cy="7" r="1.5" stroke="currentColor" stroke-width="1.2"/>
                                        <path d="M2 14l4-4 3 3 3-4 6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                    <div class="image-upload-info">
                                        <div class="image-upload-name" id="imageFileName">9x16_01.png</div>
                                        <div class="image-upload-hint">Drop image or click to upload</div>
                                    </div>
                                    <button type="button" class="image-remove-btn" id="imageRemoveBtn" aria-label="Reset image">
                                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                        </svg>
                                    </button>
                                </div>
                                <input type="file" id="imageFileInput" accept="image/*" style="display:none">
                            </div>
                            <div class="control-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="invertBrightnessToggle">
                                    <span>Invert brightness</span>
                                </label>
                            </div>
                        </section>

                    </div><!-- /halftoneControls -->

                    <!-- Concentric controls -->
                    <div id="concentricControls" style="display: none;">

                        <section class="control-section">
                            <h3>Circles</h3>

                            <div class="control-group">
                                <label for="concentricCountSlider">
                                    <span>Count</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricCountValue" value="10">
                                    </div>
                                </label>
                                <input type="range" id="concentricCountSlider" min="1" max="100" step="1" value="10">
                            </div>

                            <div class="control-group">
                                <label for="concentricFontSizeSlider">
                                    <span>Font Size</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricFontSizeValue" value="24">
                                    </div>
                                </label>
                                <input type="range" id="concentricFontSizeSlider" min="4" max="200" step="1" value="24">
                            </div>

                            <div class="control-group">
                                <label for="concentricFontWeightSlider">
                                    <span>Weight</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricFontWeightValue" value="200">
                                    </div>
                                </label>
                                <input type="range" id="concentricFontWeightSlider" min="100" max="400" step="1" value="200">
                            </div>

                            <div class="control-group">
                                <label for="concentricLineSpacingSlider">
                                    <span>Line Spacing</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricLineSpacingValue" value="1.40">
                                    </div>
                                </label>
                                <input type="range" id="concentricLineSpacingSlider" min="0.50" max="5.00" step="0.05" value="1.40">
                            </div>

                            <div class="control-group">
                                <label for="concentricMinRadiusSlider">
                                    <span>Min Radius</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricMinRadiusValue" value="40">
                                    </div>
                                </label>
                                <input type="range" id="concentricMinRadiusSlider" min="0" max="500" step="1" value="40">
                            </div>

                            <div class="control-group">
                                <label for="concentricMaxRadiusSlider">
                                    <span>Max Radius</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricMaxRadiusValue" value="0">
                                    </div>
                                </label>
                                <input type="range" id="concentricMaxRadiusSlider" min="0" max="2000" step="1" value="0">
                            </div>

                            <div class="control-group">
                                <label for="concentricStartAngleSlider">
                                    <span>Start Angle</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricStartAngleValue" value="0">
                                    </div>
                                </label>
                                <input type="range" id="concentricStartAngleSlider" min="0" max="360" step="1" value="0">
                            </div>

                            <div class="control-group">
                                <label for="concentricCenterXSlider">
                                    <span>Center X</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricCenterXValue" value="50">
                                    </div>
                                </label>
                                <input type="range" id="concentricCenterXSlider" min="0" max="100" step="1" value="50">
                            </div>

                            <div class="control-group">
                                <label for="concentricCenterYSlider">
                                    <span>Center Y</span>
                                    <div class="value-display-wrapper">
                                        <input type="text" class="value-display" id="concentricCenterYValue" value="50">
                                    </div>
                                </label>
                                <input type="range" id="concentricCenterYSlider" min="0" max="100" step="1" value="50">
                            </div>
                        </section>

                    </div><!-- /concentricControls -->

                </div>
            </aside>

        </div>
    </div>

    <!-- Bottom Buttons -->
    <nav class="bottom-buttons" aria-label="Export actions">
        <button class="btn-fixed btn-export-settings" id="exportSettingsBtn" type="button">Export Settings</button>
        <button class="btn-fixed btn-import-settings" id="importSettingsBtn" type="button">Import Settings</button>
        <div class="export-group-right">
            <button class="btn-fixed btn-export" id="exportSvgBtn" type="button">Export SVG ⌘E</button>
            <label class="toggle-label">
                <div class="toggle-switch">
                    <input type="checkbox" id="convertToOutlinesCheckbox" aria-label="Outline fonts">
                    <span class="toggle-slider"></span>
                </div>
                <span class="toggle-label-text">Outline fonts</span>
            </label>
        </div>
    </nav>

    <script type="module">
        import { HalftoneApp } from './src/HalftoneApp.js';
        document.addEventListener('DOMContentLoaded', () => {
            const app = new HalftoneApp();
            app.init();
        });
    </script>
</body>
</html>
