<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wander Bender - YF Tools</title>
    <link rel="stylesheet" href="css/yf-styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <style>
        /* Custom styles for max button */
        .unit-btn.active {
            background: #fff;
            color: #000;
            opacity: 1;
        }
        
        .value-display:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Hover effect for interactive rectangles */
        .hit-area:hover {
            fill: rgba(255, 255, 255, 0.1) !important;
        }
        
        .extracted-shape {
            transition: opacity 0.2s;
        }
        
        .extracted-shape:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation -->
        <div class="top-links">
            <a href="/js/YF/" class="yf-tools-link">←YF Tools</a>
            <button class="zoom-indicator" id="zoomIndicator">100%</button>
        </div>

        <div class="main-content">
            <!-- Main Canvas/Content Area -->
            <div class="canvas-container" id="canvasContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
                    <rect width="500" height="500" fill="#000"/>
                    <g id="graphicsGroup"></g>
                </svg>
            </div>

            <!-- Control Panel (right side) -->
            <aside class="controls-panel" id="controlsPanel">
                <div class="panel-header" id="controlsPanelHeader">
                    <span>Wander Bender</span>
                    <span class="collapse-icon">
                        <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="panel-content">
                    <!-- Mode Selector -->
                    <section class="control-section">
                        <fieldset>
                            <legend class="sr-only">Distribution Mode</legend>
                            <div class="segmented-control">
                                <input type="radio" id="modeRadial" name="mode" value="radial" checked>
                                <label for="modeRadial">Radial</label>
                                
                                <input type="radio" id="modeRandom" name="mode" value="random">
                                <label for="modeRandom">Random</label>
                            </div>
                        </fieldset>
                    </section>

                    <!-- Shape Parameters (Global) -->
                    <section class="control-section">
                        <h3>Shape</h3>
                        
                        <div class="control-group">
                            <label for="lengthSlider">
                                <span>Length</span>
                                <input type="text" class="value-display" id="lengthValue" value="125">
                            </label>
                            <input type="range" id="lengthSlider" min="50" max="400" value="125" step="1">
                        </div>

                        <div class="control-group">
                            <label for="widthSlider">
                                <span>Width</span>
                                <input type="text" class="value-display" id="widthValue" value="50">
                            </label>
                            <input type="range" id="widthSlider" min="20" max="150" value="50" step="1">
                        </div>

                        <div class="control-group">
                            <label for="strokeSlider">
                                <span>Stroke</span>
                                <div class="value-display-wrapper">
                                    <input type="text" class="value-display" id="strokeValue" value="45">
                                    <button type="button" class="unit-btn" id="strokeAutoBtn">auto</button>
                                </div>
                            </label>
                            <input type="range" id="strokeSlider" min="1" max="100" value="45" step="1">
                        </div>

                        <div class="control-group">
                            <label for="cornerRadiusSlider">
                                <span>Corner Radius</span>
                                <div class="value-display-wrapper">
                                    <input type="text" class="value-display" id="cornerRadiusValue" value="25">
                                    <button type="button" class="unit-btn" id="cornerRadiusMaxBtn">max</button>
                                </div>
                            </label>
                            <input type="range" id="cornerRadiusSlider" min="0" max="25" value="25" step="1">
                        </div>
                    </section>

                    <!-- Distribution Parameters (Mode-specific) -->
                    <section class="control-section">
                        <h3>Distribution</h3>
                        
                        <!-- Radial Mode Controls -->
                        <div id="radialControls">
                            <div class="control-group">
                                <label for="raysSlider">
                                    <span>Rays</span>
                                    <input type="text" class="value-display" id="raysValue" value="3">
                                </label>
                                <input type="range" id="raysSlider" min="1" max="12" value="3" step="1">
                            </div>
                        
                            <div class="control-group">
                                <label for="rayRotationSlider">
                                    <span>Ray Rotation</span>
                                    <input type="text" class="value-display" id="rayRotationValue" value="0">
                                </label>
                                <input type="range" id="rayRotationSlider" min="0" max="360" value="0" step="1">
                            </div>
                            
                            <div class="control-group">
                                <button type="button" class="btn-secondary" id="resetExtractedRadialBtn" style="width: 100%; margin-top: 8px;">Reset Extracted</button>
                            </div>
                        </div>
                        
                        <!-- Random Mode Controls -->
                        <div id="randomControls" style="display: none;">
                            <div class="control-group">
                                <label for="randomCountSlider">
                                    <span>Count</span>
                                    <input type="text" class="value-display" id="randomCountValue" value="3">
                                </label>
                                <input type="range" id="randomCountSlider" min="3" max="50" value="3" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="areaWidthSlider">
                                    <span>Area Width</span>
                                    <input type="text" class="value-display" id="areaWidthValue" value="200">
                                </label>
                                <input type="range" id="areaWidthSlider" min="100" max="500" value="200" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="areaHeightSlider">
                                    <span>Area Height</span>
                                    <input type="text" class="value-display" id="areaHeightValue" value="200">
                                </label>
                                <input type="range" id="areaHeightSlider" min="100" max="500" value="200" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="lengthVariationSlider">
                                    <span>Length Variation</span>
                                    <input type="text" class="value-display" id="lengthVariationValue" value="50">
                                </label>
                                <input type="range" id="lengthVariationSlider" min="0" max="100" value="50" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="randomSeedSlider">
                                    <span>Random Seed</span>
                                    <input type="text" class="value-display" id="randomSeedValue" value="12345">
                                </label>
                                <input type="range" id="randomSeedSlider" min="1" max="99999" value="12345" step="1">
                            </div>
                            
                            <div class="control-group">
                                <button type="button" class="btn-secondary" id="resetExtractedBtn" style="width: 100%; margin-top: 8px;">Reset Extracted</button>
                            </div>
                        </div>
                    </section>
                </div>
            </aside>
        </div>
    </div>

    <!-- Bottom Action Buttons -->
    <nav class="bottom-buttons">
        <button class="btn-fixed btn-export" id="exportBtn">Export SVG</button>
    </nav>

    <script type="module">
        // Import framework modules
        import { SliderController } from './js/ui/SliderController.js';
        import { PanelManager } from './js/ui/PanelManager.js';
        import { ZoomPanManager } from './js/ui/ZoomPanManager.js';

        // Settings storage
        const settings = {
            mode: 'radial',
            
            global: {
                length: 125,
                width: 50,
                stroke: 45,
                strokeAuto: true,  // Auto calculate stroke based on width
                cornerRadius: 25,
                cornerRadiusMax: true  // Keep corner radius at maximum
            },
            
            radial: {
                rays: 3,
                rayRotation: 0
            },
            
            random: {
                count: 3,
                areaWidth: 200,
                areaHeight: 200,
                lengthVariation: 50,  // Percentage variation in length
                randomSeed: 12345
            },
            
            // Helper methods for backward compatibility
            get(key) {
                // Check global settings first
                if (this.global.hasOwnProperty(key)) {
                    return this.global[key];
                }
                // Then check mode-specific settings
                if (this[this.mode] && this[this.mode].hasOwnProperty(key)) {
                    return this[this.mode][key];
                }
                return undefined;
            },
            
            set(key, value) {
                // Set in global settings if it exists there
                if (this.global.hasOwnProperty(key)) {
                    this.global[key] = value;
                }
                // Otherwise set in mode-specific settings
                else if (this[this.mode] && this[this.mode].hasOwnProperty(key)) {
                    this[this.mode][key] = value;
                }
            }
        };

        // Wander Bender Generator
        class WanderBenderGenerator {
            constructor(svgElement) {
                this.svg = svgElement;
                this.group = document.getElementById('graphicsGroup');
                this.centerX = 250;
                this.centerY = 250;
                
                // Setup Paper.js
                paper.setup(new paper.Size(500, 500));
                
                // Store rectangles data for random mode
                this.randomRectangles = [];
                this.extractedIndices = []; // Array to preserve extraction order
                this.currentParams = null; // Store current generation parameters
                
                // Store rays data for radial mode
                this.radialRays = [];
                this.extractedRadialIndices = [];
            }
            
            // Create a shape from a line path
            // line is an array of points: [{x, y}, {x, y}, ...]
            // width is the thickness of the resulting shape
            // cornerRadius is applied to the ends
            createShapeFromLine(line, width, cornerRadius) {
                if (line.length < 2) return null;
                
                // For straight line (2 points), create a rounded rectangle
                if (line.length === 2) {
                    const start = line[0];
                    const end = line[1];
                    
                    // Calculate length
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    // Create rectangle
                    // Position it so that start point is at (0, 0) with proper offset for width
                    const rect = new paper.Path.Rectangle({
                        point: [start.x, start.y - width / 2],
                        size: [length, width],
                        radius: cornerRadius
                    });
                    
                    // Rotate around start point if needed
                    if (angle !== 0) {
                        rect.rotate(angle, new paper.Point(start.x, start.y));
                    }
                    
                    return rect;
                }
                
                // For curved lines (future implementation)
                // This will be extended later for bezier curves, arcs, etc.
                return null;
            }

            generateRadial(params) {
                let { rays, rayRotation, length, width, stroke, cornerRadius } = params;
                
                // Store params for regeneration
                this.currentParams = params;
                
                // Ensure corner radius doesn't exceed half of width
                cornerRadius = Math.min(cornerRadius, width / 2);
                
                // Clear previous graphics
                this.group.innerHTML = '';

                // Calculate angle step
                const angleStep = (2 * Math.PI) / rays;
                
                // Store rays data
                this.radialRays = [];
                
                for (let i = 0; i < rays; i++) {
                    // Start at 6 o'clock position (90 degrees)
                    const angle = (i * angleStep) + (Math.PI / 2);
                    
                    // Calculate center position
                    const centerX = this.centerX;
                    const centerY = this.centerY;
                    
                    // Define line: from (0,0) to length
                    // The pivot point will be at (cornerRadius, 0) - at cornerRadius distance from start
                    const lineStart = { x: 0, y: 0 };
                    const lineEnd = { x: length, y: 0 };
                    
                    // Store ray data
                    this.radialRays.push({
                        line: [lineStart, lineEnd],
                        angle: angle * 180 / Math.PI,
                        rayRotation,
                        centerX,
                        centerY,
                        pivotX: cornerRadius,
                        pivotY: width / 2,
                        length,
                        width,
                        cornerRadius
                    });
                }
                
                // Render the composition
                this.renderRadialComposition(stroke);
            }
            
            renderRadialComposition(stroke) {
                // Clear group
                this.group.innerHTML = '';
                
                // Create Paper.js paths for non-extracted rays
                let unitedPath = null;
                
                for (let i = 0; i < this.radialRays.length; i++) {
                    if (this.extractedRadialIndices.includes(i)) {
                        // This ray is extracted, skip for united path
                        continue;
                    }
                    
                    const { line, angle, rayRotation, centerX, centerY, pivotX, pivotY, width, cornerRadius } = this.radialRays[i];
                    
                    // Create shape from line
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    // Translate so that pivot point is at origin
                    shape.translate(new paper.Point(-pivotX, -pivotY));
                    
                    // First rotate by radial angle (around origin = pivot point)
                    shape.rotate(angle, new paper.Point(0, 0));
                    
                    // Then move to centerX, centerY
                    shape.translate(new paper.Point(centerX, centerY));
                    
                    // Then rotate each ray around its own center
                    if (rayRotation !== 0) {
                        const shapeCenter = shape.bounds.center;
                        shape.rotate(rayRotation, shapeCenter);
                    }
                    
                    // Unite with previous shapes
                    if (unitedPath === null) {
                        unitedPath = shape;
                    } else {
                        unitedPath = unitedPath.unite(shape);
                        shape.remove();
                    }
                }
                
                // Render united path (if any rays remain united)
                if (unitedPath) {
                    const pathData = unitedPath.pathData;
                    unitedPath.remove();
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke', '#ffffff');
                    path.setAttribute('stroke-width', stroke);
                    path.setAttribute('stroke-linejoin', 'round');
                    path.classList.add('united-shape');
                    
                    this.group.appendChild(path);
                }
                
                // Render interactive hit areas for non-extracted rays
                for (let i = 0; i < this.radialRays.length; i++) {
                    if (this.extractedRadialIndices.includes(i)) continue;
                    
                    const { line, angle, rayRotation, centerX, centerY, pivotX, pivotY, width, cornerRadius } = this.radialRays[i];
                    
                    // Create shape from line for hit area
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    shape.translate(new paper.Point(-pivotX, -pivotY));
                    shape.rotate(angle, new paper.Point(0, 0));
                    shape.translate(new paper.Point(centerX, centerY));
                    if (rayRotation !== 0) {
                        const shapeCenter = shape.bounds.center;
                        shape.rotate(rayRotation, shapeCenter);
                    }
                    
                    const pathData = shape.pathData;
                    shape.remove();
                    
                    // Create invisible hit area
                    const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    hitArea.setAttribute('d', pathData);
                    hitArea.setAttribute('fill', 'transparent');
                    hitArea.setAttribute('stroke', 'none');
                    hitArea.style.cursor = 'pointer';
                    hitArea.classList.add('hit-area');
                    hitArea.dataset.rayIndex = i;
                    
                    // Add click handler
                    hitArea.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.extractRadialRay(i);
                    });
                    
                    this.group.appendChild(hitArea);
                }
                
                // Render extracted rays in order of extraction (bottom to top)
                for (const index of this.extractedRadialIndices) {
                    const { line, angle, rayRotation, centerX, centerY, pivotX, pivotY, width, cornerRadius } = this.radialRays[index];
                    
                    // Create shape from line
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    shape.translate(new paper.Point(-pivotX, -pivotY));
                    shape.rotate(angle, new paper.Point(0, 0));
                    shape.translate(new paper.Point(centerX, centerY));
                    if (rayRotation !== 0) {
                        const shapeCenter = shape.bounds.center;
                        shape.rotate(rayRotation, shapeCenter);
                    }
                    
                    const pathData = shape.pathData;
                    shape.remove();
                    
                    // Create SVG path
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('fill', '#000000'); // Black fill like background
                    path.setAttribute('stroke', '#ffffff');
                    path.setAttribute('stroke-width', stroke);
                    path.setAttribute('stroke-linejoin', 'round');
                    path.classList.add('extracted-shape');
                    path.dataset.rayIndex = index;
                    path.style.cursor = 'pointer';
                    
                    // Add click handler to return to united group
                    path.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.returnRadialRay(index);
                    });
                    
                    this.group.appendChild(path);
                }
            }
            
            extractRadialRay(index) {
                // Add to extracted array if not already there
                if (!this.extractedRadialIndices.includes(index)) {
                    this.extractedRadialIndices.push(index);
                }
                this.renderRadialComposition(this.currentParams.stroke);
            }
            
            returnRadialRay(index) {
                // Remove from extracted array
                const position = this.extractedRadialIndices.indexOf(index);
                if (position > -1) {
                    this.extractedRadialIndices.splice(position, 1);
                }
                this.renderRadialComposition(this.currentParams.stroke);
            }
            
            resetRadialMode() {
                this.extractedRadialIndices = [];
                if (this.currentParams) {
                    this.renderRadialComposition(this.currentParams.stroke);
                }
            }
            
            // Seeded random number generator for reproducibility
            seededRandom(seed) {
                let state = seed;
                return function() {
                    state = (state * 9301 + 49297) % 233280;
                    return state / 233280;
                };
            }
            
            generateRandom(params) {
                let { count, areaWidth, areaHeight, lengthVariation, randomSeed, length, width, stroke, cornerRadius } = params;
                
                // Store params for regeneration
                this.currentParams = params;
                
                // Ensure corner radius doesn't exceed half of width
                cornerRadius = Math.min(cornerRadius, width / 2);
                
                // Clear previous graphics
                this.group.innerHTML = '';
                
                // Initialize seeded random
                const random = this.seededRandom(randomSeed);
                
                // Store rectangles data
                this.randomRectangles = [];
                
                // Calculate area bounds (centered on canvas)
                const areaLeft = this.centerX - areaWidth / 2;
                const areaTop = this.centerY - areaHeight / 2;
                
                for (let i = 0; i < count; i++) {
                    // Random position within area
                    const x = areaLeft + random() * areaWidth;
                    const y = areaTop + random() * areaHeight;
                    
                    // Random angle (0-360 degrees)
                    const angle = random() * 360;
                    
                    // Random length variation
                    const lengthMultiplier = 1 + (random() * 2 - 1) * (lengthVariation / 100);
                    const actualLength = length * lengthMultiplier;
                    
                    // Define line: straight line of actualLength
                    const lineStart = { x: 0, y: 0 };
                    const lineEnd = { x: actualLength, y: 0 };
                    
                    // Store rectangle data
                    this.randomRectangles.push({
                        line: [lineStart, lineEnd],
                        x, y, angle, width, cornerRadius
                    });
                }
                
                // Render the composition
                this.renderRandomComposition(stroke, areaWidth, areaHeight);
            }
            
            renderRandomComposition(stroke, areaWidth, areaHeight) {
                // Clear group
                this.group.innerHTML = '';
                
                // Draw area boundary (subtle dark gray rectangle)
                const areaRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                areaRect.setAttribute('x', this.centerX - areaWidth / 2);
                areaRect.setAttribute('y', this.centerY - areaHeight / 2);
                areaRect.setAttribute('width', areaWidth);
                areaRect.setAttribute('height', areaHeight);
                areaRect.setAttribute('fill', 'none');
                areaRect.setAttribute('stroke', '#333333');
                areaRect.setAttribute('stroke-width', '0.5');
                areaRect.classList.add('area-boundary');
                this.group.appendChild(areaRect);
                
                // Create Paper.js paths for non-extracted rectangles
                let unitedPath = null;
                
                for (let i = 0; i < this.randomRectangles.length; i++) {
                    if (this.extractedIndices.includes(i)) {
                        // This rectangle is extracted, skip for united path
                        continue;
                    }
                    
                    const { line, x, y, angle, width, cornerRadius } = this.randomRectangles[i];
                    
                    // Create shape from line
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    // Position at x,y
                    shape.translate(new paper.Point(x, y));
                    
                    // Rotate around center
                    shape.rotate(angle, new paper.Point(x, y));
                    
                    // Unite with previous shapes
                    if (unitedPath === null) {
                        unitedPath = shape;
                    } else {
                        unitedPath = unitedPath.unite(shape);
                        shape.remove();
                    }
                }
                
                // Render united path (if any rectangles remain united)
                if (unitedPath) {
                    const pathData = unitedPath.pathData;
                    unitedPath.remove();
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke', '#ffffff');
                    path.setAttribute('stroke-width', stroke);
                    path.setAttribute('stroke-linejoin', 'round');
                    path.classList.add('united-shape');
                    
                    this.group.appendChild(path);
                }
                
                // Render interactive hit areas for non-extracted rectangles
                for (let i = 0; i < this.randomRectangles.length; i++) {
                    if (this.extractedIndices.includes(i)) continue;
                    
                    const { line, x, y, angle, width, cornerRadius } = this.randomRectangles[i];
                    
                    // Create shape from line for hit area
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    shape.translate(new paper.Point(x, y));
                    shape.rotate(angle, new paper.Point(x, y));
                    
                    const pathData = shape.pathData;
                    shape.remove();
                    
                    // Create invisible hit area
                    const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    hitArea.setAttribute('d', pathData);
                    hitArea.setAttribute('fill', 'transparent');
                    hitArea.setAttribute('stroke', 'none');
                    hitArea.style.cursor = 'pointer';
                    hitArea.classList.add('hit-area');
                    hitArea.dataset.rectIndex = i;
                    
                    // Add click handler
                    hitArea.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.extractRectangle(i);
                    });
                    
                    this.group.appendChild(hitArea);
                }
                
                // Render extracted rectangles in order of extraction (bottom to top)
                for (const index of this.extractedIndices) {
                    const { line, x, y, angle, width, cornerRadius } = this.randomRectangles[index];
                    
                    // Create shape from line
                    const shape = this.createShapeFromLine(line, width, cornerRadius);
                    if (!shape) continue;
                    
                    shape.translate(new paper.Point(x, y));
                    shape.rotate(angle, new paper.Point(x, y));
                    
                    const pathData = shape.pathData;
                    shape.remove();
                    
                    // Create SVG path
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', pathData);
                    path.setAttribute('fill', '#000000'); // Black fill like background
                    path.setAttribute('stroke', '#ffffff');
                    path.setAttribute('stroke-width', stroke);
                    path.setAttribute('stroke-linejoin', 'round');
                    path.classList.add('extracted-shape');
                    path.dataset.rectIndex = index;
                    path.style.cursor = 'pointer';
                    
                    // Add click handler to return to united group
                    path.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.returnRectangle(index);
                    });
                    
                    this.group.appendChild(path);
                }
            }
            
            extractRectangle(index) {
                // Add to extracted array if not already there
                if (!this.extractedIndices.includes(index)) {
                    this.extractedIndices.push(index);
                }
                this.renderRandomComposition(
                    this.currentParams.stroke, 
                    this.currentParams.areaWidth, 
                    this.currentParams.areaHeight
                );
            }
            
            returnRectangle(index) {
                // Remove from extracted array
                const position = this.extractedIndices.indexOf(index);
                if (position > -1) {
                    this.extractedIndices.splice(position, 1);
                }
                this.renderRandomComposition(
                    this.currentParams.stroke, 
                    this.currentParams.areaWidth, 
                    this.currentParams.areaHeight
                );
            }
            
            resetRandomMode() {
                this.extractedIndices = [];
                if (this.currentParams) {
                    this.renderRandomComposition(
                        this.currentParams.stroke, 
                        this.currentParams.areaWidth, 
                        this.currentParams.areaHeight
                    );
                }
            }
            
            generate(params) {
                const mode = params.mode || 'radial';
                
                if (mode === 'radial') {
                    this.generateRadial(params);
                } else if (mode === 'random') {
                    this.generateRandom(params);
                }
            }
        }

        // Initialize generator
        const generator = new WanderBenderGenerator(document.getElementById('mainSvg'));

        // Update visualization
        function updateVisualization() {
            const params = {
                mode: settings.mode,
                length: settings.get('length'),
                width: settings.get('width'),
                stroke: settings.get('stroke'),
                cornerRadius: settings.get('cornerRadius')
            };
            
            // Add mode-specific parameters
            if (settings.mode === 'radial') {
                params.rays = settings.get('rays');
                params.rayRotation = settings.get('rayRotation');
            } else if (settings.mode === 'random') {
                params.count = settings.get('count');
                params.areaWidth = settings.get('areaWidth');
                params.areaHeight = settings.get('areaHeight');
                params.lengthVariation = settings.get('lengthVariation');
                params.randomSeed = settings.get('randomSeed');
            }
            
            generator.generate(params);
        }

        // Initialize SliderController
        const sliderController = new SliderController(settings);
        
        // Mode switcher
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                settings.mode = e.target.value;
                
                // Show/hide mode-specific controls
                const radialControls = document.getElementById('radialControls');
                const randomControls = document.getElementById('randomControls');
                
                // Hide all
                radialControls.style.display = 'none';
                randomControls.style.display = 'none';
                
                // Show active
                if (settings.mode === 'radial') {
                    radialControls.style.display = 'block';
                } else if (settings.mode === 'random') {
                    randomControls.style.display = 'block';
                }
                
                updateVisualization();
            });
        });
        
        sliderController.initSlider('raysSlider', {
            valueId: 'raysValue',
            setting: 'rays',
            min: 1,
            max: 12,
            decimals: 0,
            baseStep: 1,
            shiftStep: 1,
            onUpdate: updateVisualization
        });
        
        sliderController.initSlider('rayRotationSlider', {
            valueId: 'rayRotationValue',
            setting: 'rayRotation',
            min: 0,
            max: 360,
            decimals: 0,
            baseStep: 1,
            shiftStep: 15,
            onUpdate: updateVisualization
        });
        
        // Random mode sliders
        sliderController.initSlider('randomCountSlider', {
            valueId: 'randomCountValue',
            setting: 'count',
            min: 3,
            max: 50,
            decimals: 0,
            baseStep: 1,
            shiftStep: 5,
            onUpdate: updateVisualization
        });
        
        sliderController.initSlider('areaWidthSlider', {
            valueId: 'areaWidthValue',
            setting: 'areaWidth',
            min: 100,
            max: 500,
            decimals: 0,
            baseStep: 10,
            shiftStep: 50,
            onUpdate: updateVisualization
        });
        
        sliderController.initSlider('areaHeightSlider', {
            valueId: 'areaHeightValue',
            setting: 'areaHeight',
            min: 100,
            max: 500,
            decimals: 0,
            baseStep: 10,
            shiftStep: 50,
            onUpdate: updateVisualization
        });
        
        sliderController.initSlider('lengthVariationSlider', {
            valueId: 'lengthVariationValue',
            setting: 'lengthVariation',
            min: 0,
            max: 100,
            decimals: 0,
            baseStep: 1,
            shiftStep: 10,
            onUpdate: updateVisualization
        });
        
        sliderController.initSlider('randomSeedSlider', {
            valueId: 'randomSeedValue',
            setting: 'randomSeed',
            min: 1,
            max: 99999,
            decimals: 0,
            baseStep: 1,
            shiftStep: 100,
            onUpdate: updateVisualization
        });

        sliderController.initSlider('lengthSlider', {
            valueId: 'lengthValue',
            setting: 'length',
            min: 25,
            max: 400,
            decimals: 0,
            baseStep: 1,
            shiftStep: 10,
            onUpdate: updateVisualization
        });

        sliderController.initSlider('widthSlider', {
            valueId: 'widthValue',
            setting: 'width',
            min: 20,
            max: 150,
            decimals: 0,
            baseStep: 1,
            shiftStep: 5,
            onUpdate: (value) => {
                // Update stroke if auto mode is enabled
                if (settings.get('strokeAuto')) {
                    const autoStroke = value - 5;
                    settings.set('stroke', autoStroke);
                    document.getElementById('strokeValue').value = autoStroke;
                    document.getElementById('strokeSlider').value = autoStroke;
                }
                
                // Update corner radius maximum to half of width
                const cornerRadiusSlider = document.getElementById('cornerRadiusSlider');
                const maxCornerRadius = value / 2;
                cornerRadiusSlider.setAttribute('max', maxCornerRadius);
                
                // If "Max" checkbox is checked, automatically update corner radius
                if (settings.get('cornerRadiusMax')) {
                    settings.set('cornerRadius', maxCornerRadius);
                    document.getElementById('cornerRadiusValue').value = maxCornerRadius;
                    cornerRadiusSlider.value = maxCornerRadius;
                }
                // Otherwise, just clamp if it exceeds maximum
                else if (settings.get('cornerRadius') > maxCornerRadius) {
                    settings.set('cornerRadius', maxCornerRadius);
                    document.getElementById('cornerRadiusValue').value = maxCornerRadius;
                    cornerRadiusSlider.value = maxCornerRadius;
                }
                
                updateVisualization();
            }
        });

        sliderController.initSlider('strokeSlider', {
            valueId: 'strokeValue',
            setting: 'stroke',
            min: 1,
            max: 100,
            decimals: 0,
            baseStep: 1,
            shiftStep: 5,
            onUpdate: (value) => {
                // Deactivate "auto" button when manually changing stroke
                const autoBtn = document.getElementById('strokeAutoBtn');
                if (autoBtn.classList.contains('active')) {
                    autoBtn.classList.remove('active');
                    settings.set('strokeAuto', false);
                }
                updateVisualization();
            }
        });

        // Stroke Auto button
        const strokeAutoBtn = document.getElementById('strokeAutoBtn');
        const strokeSlider = document.getElementById('strokeSlider');
        const strokeValue = document.getElementById('strokeValue');
        
        // Set initial state
        if (settings.get('strokeAuto')) {
            strokeAutoBtn.classList.add('active');
            strokeSlider.disabled = true;
            strokeValue.disabled = true;
        }
        
        strokeAutoBtn.addEventListener('click', () => {
            const isActive = strokeAutoBtn.classList.toggle('active');
            settings.set('strokeAuto', isActive);
            
            if (isActive) {
                // Calculate and set auto stroke (width - 5 for 10px counterform)
                const autoStroke = settings.get('width') - 5;
                settings.set('stroke', autoStroke);
                strokeValue.value = autoStroke;
                strokeSlider.value = autoStroke;
                strokeSlider.disabled = true;
                strokeValue.disabled = true;
            } else {
                // Enable slider
                strokeSlider.disabled = false;
                strokeValue.disabled = false;
            }
            
            updateVisualization();
        });

        sliderController.initSlider('cornerRadiusSlider', {
            valueId: 'cornerRadiusValue',
            setting: 'cornerRadius',
            min: 0,
            max: settings.get('width') / 2,
            decimals: 0,
            baseStep: 1,
            shiftStep: 5,
            onUpdate: (value) => {
                // Deactivate "Max" button when manually changing corner radius
                const maxBtn = document.getElementById('cornerRadiusMaxBtn');
                if (maxBtn.classList.contains('active')) {
                    maxBtn.classList.remove('active');
                    settings.set('cornerRadiusMax', false);
                }
                updateVisualization();
            }
        });

        // Corner Radius Max button
        const cornerRadiusMaxBtn = document.getElementById('cornerRadiusMaxBtn');
        const cornerRadiusSlider = document.getElementById('cornerRadiusSlider');
        const cornerRadiusValue = document.getElementById('cornerRadiusValue');
        
        // Set initial state
        if (settings.get('cornerRadiusMax')) {
            cornerRadiusMaxBtn.classList.add('active');
            cornerRadiusSlider.disabled = true;
            cornerRadiusValue.disabled = true;
        }
        
        cornerRadiusMaxBtn.addEventListener('click', () => {
            const isActive = cornerRadiusMaxBtn.classList.toggle('active');
            settings.set('cornerRadiusMax', isActive);
            
            if (isActive) {
                // Set to maximum and disable slider
                const maxValue = settings.get('width') / 2;
                settings.set('cornerRadius', maxValue);
                cornerRadiusValue.value = maxValue;
                cornerRadiusSlider.value = maxValue;
                cornerRadiusSlider.disabled = true;
                cornerRadiusValue.disabled = true;
            } else {
                // Enable slider
                cornerRadiusSlider.disabled = false;
                cornerRadiusValue.disabled = false;
            }
            
            updateVisualization();
        });

        // Reset Extracted button for Random mode
        document.getElementById('resetExtractedBtn').addEventListener('click', () => {
            generator.resetRandomMode();
        });
        
        // Reset Extracted button for Radial mode
        document.getElementById('resetExtractedRadialBtn').addEventListener('click', () => {
            generator.resetRadialMode();
        });

        // Initialize PanelManager
        const panelManager = new PanelManager();
        panelManager.registerPanel('controlsPanel', {
            headerId: 'controlsPanelHeader',
            draggable: true,
            persistent: true
        });

        // Initialize ZoomPanManager
        const zoomPanManager = new ZoomPanManager(
            document.getElementById('canvasContainer'),
            document.getElementById('mainSvg')
        );

        // Update zoom indicator
        document.getElementById('canvasContainer').addEventListener('zoomchange', (e) => {
            document.getElementById('zoomIndicator').textContent = e.detail.percent + '%';
        });

        // Reset zoom on click
        document.getElementById('zoomIndicator').addEventListener('click', () => {
            zoomPanManager.resetZoom();
        });

        // Panel collapse
        document.querySelectorAll('.collapse-icon').forEach(icon => {
            icon.addEventListener('click', function() {
                this.closest('.controls-panel').classList.toggle('panel-collapsed');
                this.classList.toggle('collapsed');
            });
        });

        // Export functionality
        document.getElementById('exportBtn').addEventListener('click', () => {
            const svgElement = document.getElementById('mainSvg');
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `wander-bender-${settings.get('rays')}-rays.svg`;
            link.click();
            URL.revokeObjectURL(url);
        });

        // Initialize
        updateVisualization();
    </script>
</body>
</html>
