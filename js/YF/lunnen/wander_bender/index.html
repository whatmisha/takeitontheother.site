<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wander Bender - YF Tools</title>
    <link rel="stylesheet" href="css/yf-styles.css">
    <link rel="stylesheet" href="css/wander-bender.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Top Navigation -->
        <div class="top-links">
            <a href="/js/YF/" class="yf-tools-link">←YF Tools</a>
            <button class="zoom-indicator" id="zoomIndicator">100%</button>
        </div>

        <div class="main-content">
            <!-- Main Canvas/Content Area -->
            <div class="canvas-container" id="canvasContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
                    <rect width="500" height="500" fill="#000"/>
                    <g id="graphicsGroup"></g>
                </svg>
            </div>

            <!-- Control Panel (right side) -->
            <aside class="controls-panel" id="controlsPanel">
                <div class="panel-header" id="controlsPanelHeader">
                    <span>Wander Bender</span>
                    <span class="collapse-icon">
                        <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="panel-content">
                    <!-- Mode Selector -->
                    <section class="control-section">
                        <fieldset>
                            <legend class="sr-only">Distribution Mode</legend>
                            <div class="segmented-control">
                                <input type="radio" id="modeRadial" name="mode" value="radial" checked>
                                <label for="modeRadial">Radial</label>
                                
                                <input type="radio" id="modeRandom" name="mode" value="random">
                                <label for="modeRandom">Random</label>
                                
                                <input type="radio" id="modeFlowField" name="mode" value="flowfield">
                                <label for="modeFlowField">Flow Field</label>
                            </div>
                        </fieldset>
                    </section>

                    <!-- Shape Parameters (Global) -->
                    <section class="control-section">
                        <h3>Shape</h3>
                        
                        <div class="control-group">
                            <label for="lengthSlider">
                                <span>Length</span>
                                <input type="text" class="value-display" id="lengthValue" value="63">
                            </label>
                            <input type="range" id="lengthSlider" min="50" max="500" value="63" step="1">
                        </div>

                        <div class="control-group">
                            <label for="widthSlider">
                                <span>Width</span>
                                <input type="text" class="value-display" id="widthValue" value="25">
                            </label>
                            <input type="range" id="widthSlider" min="10" max="200" value="25" step="1">
                        </div>

                        <div class="control-group">
                            <label for="strokeSlider">
                                <span>Stroke</span>
                                <div class="value-display-wrapper">
                                    <input type="text" class="value-display" id="strokeValue" value="45">
                                    <button type="button" class="unit-btn" id="strokeAutoBtn">auto</button>
                                </div>
                            </label>
                            <input type="range" id="strokeSlider" min="1" max="100" value="45" step="1">
                        </div>

                        <div class="control-group">
                            <label for="cornerRadiusSlider">
                                <span>Corner Radius</span>
                                <div class="value-display-wrapper">
                                    <input type="text" class="value-display" id="cornerRadiusValue" value="25">
                                    <button type="button" class="unit-btn" id="cornerRadiusMaxBtn">max</button>
                                </div>
                            </label>
                            <input type="range" id="cornerRadiusSlider" min="0" max="25" value="25" step="1">
                        </div>
                        
                        <div class="control-group">
                            <label for="arcAmountSlider">
                                <span>Arc Amount</span>
                                <input type="text" class="value-display" id="arcAmountValue" value="0">
                            </label>
                            <input type="range" id="arcAmountSlider" min="0" max="100" value="0" step="1">
                        </div>
                    </section>

                    <!-- Distribution Parameters (Mode-specific) -->
                    <section class="control-section">
                        <h3>Distribution</h3>
                        
                        <!-- Radial Mode Controls -->
                        <div id="radialControls">
                            <div class="control-group">
                                <label for="raysSlider">
                                    <span>Rays</span>
                                    <input type="text" class="value-display" id="raysValue" value="3">
                                </label>
                                <input type="range" id="raysSlider" min="1" max="12" value="3" step="1">
                            </div>
                        
                            <div class="control-group">
                                <label for="rayRotationSlider">
                                    <span>Ray Rotation</span>
                                    <input type="text" class="value-display" id="rayRotationValue" value="0">
                                </label>
                                <input type="range" id="rayRotationSlider" min="0" max="360" value="0" step="1">
                            </div>
                            
                            <div class="control-group">
                                <button type="button" class="btn-secondary" id="resetExtractedRadialBtn" style="width: 100%; margin-top: 8px;">Reset Extracted</button>
                            </div>
                        </div>
                        
                        <!-- Random Mode Controls -->
                        <div id="randomControls" style="display: none;">
                            <div class="control-group">
                                <label for="randomCountSlider">
                                    <span>Count</span>
                                    <input type="text" class="value-display" id="randomCountValue" value="3">
                                </label>
                                <input type="range" id="randomCountSlider" min="3" max="50" value="3" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="areaWidthSlider">
                                    <span>Area Width</span>
                                    <input type="text" class="value-display" id="areaWidthValue" value="400">
                                </label>
                                <input type="range" id="areaWidthSlider" min="100" max="500" value="400" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="areaHeightSlider">
                                    <span>Area Height</span>
                                    <input type="text" class="value-display" id="areaHeightValue" value="400">
                                </label>
                                <input type="range" id="areaHeightSlider" min="100" max="500" value="400" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="lengthVariationSlider">
                                    <span>Length Variation</span>
                                    <input type="text" class="value-display" id="lengthVariationValue" value="50">
                                </label>
                                <input type="range" id="lengthVariationSlider" min="0" max="100" value="50" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="randomSeedSlider">
                                    <span>Random Seed</span>
                                    <input type="text" class="value-display" id="randomSeedValue" value="12345">
                                </label>
                                <input type="range" id="randomSeedSlider" min="1" max="99999" value="12345" step="1">
                            </div>
                            
                            <div class="control-group">
                                <button type="button" class="btn-secondary" id="resetExtractedBtn" style="width: 100%; margin-top: 8px;">Reset Extracted</button>
                            </div>
                        </div>
                        
                        <!-- Flow Field Distribution Controls -->
                        <div id="flowFieldControls" style="display: none;">
                            <div class="control-group">
                                <label for="flowDensitySlider">
                                    <span>Density</span>
                                    <input type="text" class="value-display" id="flowDensityValue" value="50">
                                </label>
                                <input type="range" id="flowDensitySlider" min="10" max="200" value="50" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowAreaWidthSlider">
                                    <span>Area Width</span>
                                    <input type="text" class="value-display" id="flowAreaWidthValue" value="400">
                                </label>
                                <input type="range" id="flowAreaWidthSlider" min="100" max="500" value="400" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowAreaHeightSlider">
                                    <span>Area Height</span>
                                    <input type="text" class="value-display" id="flowAreaHeightValue" value="400">
                                </label>
                                <input type="range" id="flowAreaHeightSlider" min="100" max="500" value="400" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowScaleSlider">
                                    <span>Flow Scale</span>
                                    <input type="text" class="value-display" id="flowScaleValue" value="100">
                                </label>
                                <input type="range" id="flowScaleSlider" min="50" max="500" value="100" step="10">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowInfluenceSlider">
                                    <span>Flow Influence</span>
                                    <input type="text" class="value-display" id="flowInfluenceValue" value="50">
                                </label>
                                <input type="range" id="flowInfluenceSlider" min="0" max="100" value="50" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowSeedSlider">
                                    <span>Flow Seed</span>
                                    <input type="text" class="value-display" id="flowSeedValue" value="12345">
                                </label>
                                <input type="range" id="flowSeedSlider" min="1" max="99999" value="12345" step="1">
                            </div>
                            
                            <div class="control-group">
                                <label for="flowSpacingSlider">
                                    <span>Spacing</span>
                                    <input type="text" class="value-display" id="flowSpacingValue" value="-50">
                                </label>
                                <input type="range" id="flowSpacingSlider" min="-100" max="100" value="-50" step="1">
                            </div>
                            
                            <div class="control-group">
                                <button type="button" class="btn-secondary" id="resetFlowExtractedBtn" style="width: 100%; margin-top: 8px;">Reset Extracted</button>
                            </div>
                        </div>
                    </section>
                </div>
            </aside>
        </div>
    </div>

    <!-- Bottom Action Buttons -->
    <nav class="bottom-buttons">
        <button class="btn-fixed btn-export" id="exportBtn">Export SVG</button>
    </nav>

    <script type="module" src="js/wander-bender.js"></script>
</body>
</html>
