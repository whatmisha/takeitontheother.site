<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamb Pattern Generator — YF Tools</title>
    <link rel="stylesheet" href="css/yf-styles.css">
</head>
<body>
    <div class="container">
        <div class="top-links">
            <a href="/js/YF/" class="yf-tools-link">←YF Tools</a>
            <button class="zoom-indicator" id="zoomIndicator">100%</button>
        </div>

        <div class="main-content">
            <div class="canvas-container" id="canvasContainer">
                <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
                    <rect width="800" height="600" fill="#222222"/>
                    <g id="patternLayer"></g>
                </svg>
            </div>

            <aside class="controls-panel" id="mainPanel">
                <div class="panel-header" id="mainPanelHeader">
                    <span>Паттерн овечек</span>
                    <span class="collapse-icon">
                        <svg width="10" height="6" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </div>
                <div class="panel-content">
                    <section class="control-section">
                        <h3>Овечка</h3>
                        <div class="control-group">
                            <label for="bodySpreadSlider">
                                <span>Разброс тела</span>
                                <input type="text" class="value-display" id="bodySpreadValue" value="0.15">
                            </label>
                            <input type="range" id="bodySpreadSlider" min="0" max="1" step="0.05" value="0.15">
                        </div>
                        <div class="control-group">
                            <label for="eyeSizeSlider">
                                <span>Размер глаз</span>
                                <input type="text" class="value-display" id="eyeSizeValue" value="1.0">
                            </label>
                            <input type="range" id="eyeSizeSlider" min="0.5" max="2" step="0.1" value="1">
                        </div>
                        <div class="control-group">
                            <label for="earSizeSlider">
                                <span>Размер ушей</span>
                                <input type="text" class="value-display" id="earSizeValue" value="1.0">
                            </label>
                            <input type="range" id="earSizeSlider" min="0.5" max="2" step="0.1" value="1">
                        </div>
                    </section>
                    <section class="control-section">
                        <h3>Паттерн</h3>
                        <div class="control-group">
                            <label for="densitySlider">
                                <span>Плотность</span>
                                <input type="text" class="value-display" id="densityValue" value="0.25">
                            </label>
                            <input type="range" id="densitySlider" min="0.1" max="0.6" step="0.05" value="0.25">
                        </div>
                        <div class="control-group">
                            <label for="scaleSlider">
                                <span>Масштаб</span>
                                <input type="text" class="value-display" id="scaleValue" value="0.25">
                            </label>
                            <input type="range" id="scaleSlider" min="0.05" max="0.6" step="0.05" value="0.25">
                        </div>
                        <div class="control-group">
                            <label for="seedInput">
                                <span>Seed</span>
                                <input type="number" id="seedInput" class="value-display" value="42" min="1" max="99999">
                            </label>
                            <button type="button" class="btn-secondary" id="randomSeedBtn" style="margin-top: 4px;">Случайный</button>
                        </div>
                    </section>
                </div>
            </aside>
        </div>
    </div>

    <nav class="bottom-buttons">
        <div class="export-group-right">
            <button class="btn-fixed btn-export" id="exportBtn">Export SVG ⌘E</button>
        </div>
    </nav>

    <div class="modal-overlay" id="helpModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2>Lamb Pattern Generator</h2>
            <div class="modal-body">
                <p>Генератор векторного паттерна с овечками.</p>
                <h3>Горячие клавиши</h3>
                <ul>
                    <li><strong>Cmd/Ctrl + Scroll</strong> — Zoom</li>
                    <li><strong>Space + drag</strong> — Pan</li>
                    <li><strong>Cmd/Ctrl + 0</strong> — Fit to screen</li>
                    <li><strong>Cmd/Ctrl + 1</strong> — 100%</li>
                    <li><strong>Cmd/Ctrl + E</strong> — Экспорт SVG</li>
                    <li><strong>Cmd/Ctrl + /</strong> — Справка</li>
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
