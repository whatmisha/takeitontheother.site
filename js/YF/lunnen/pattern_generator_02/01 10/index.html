<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паттерна</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body>
    <!-- Панель настроек -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="radius-slider">Радиус скругления: <span id="radius-value">50%</span></label>
            <input type="range" id="radius-slider" min="0" max="100" value="50">
        </div>
        
        <div class="control-group">
            <label for="length-slider">Длина линий А: <span id="length-value">50%</span></label>
            <input type="range" id="length-slider" min="0" max="100" value="50">
        </div>
        
        <div class="control-group">
            <label for="length-b-slider">Длина линии Б: <span id="length-b-value">100%</span></label>
            <input type="range" id="length-b-slider" min="0" max="100" value="100">
        </div>
        
        <div class="control-group">
            <label for="thickness-slider">Толщина линий: <span id="thickness-value">3%</span></label>
            <input type="range" id="thickness-slider" min="1" max="100" value="3">
        </div>
        
        <div class="control-group">
            <label for="spacing-slider">Расстояние между крестами: <span id="spacing-value">50%</span></label>
            <input type="range" id="spacing-slider" min="0" max="100" value="50">
        </div>
        
        <div class="control-group">
            <label for="size-slider">Размер креста: <span id="size-value">20px</span></label>
            <input type="range" id="size-slider" min="10" max="200" value="20">
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="caps-checkbox" checked>
            <label for="caps-checkbox">Круглые окончания</label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="checkerboard-checkbox" checked>
            <label for="checkerboard-checkbox">Шахматный порядок</label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="both-squares-checkbox">
            <label for="both-squares-checkbox">Режим двух дуг</label>
        </div>
        
        <button id="export-button" class="export-btn">
            <span class="mac-shortcut">SVG (⌘E)</span>
            <span class="pc-shortcut">SVG (Ctrl+E)</span>
        </button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
