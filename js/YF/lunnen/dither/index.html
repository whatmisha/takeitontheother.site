<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dither</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
                <div class="upload-placeholder" id="uploadPlaceholder">
                    <div class="upload-icon">📁</div>
                    <p>Загрузите изображение</p>
                    <p class="upload-hint">.jpg, .png или перетащите файл</p>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>

            <div class="controls-panel">
                <div class="control-section">
                    <h3>Предобработка изображения</h3>
                    
                    <div class="control-group">
                        <label for="blur">Blur (Размытие)</label>
                        <input type="range" id="blur" min="0" max="10" step="0.1" value="0">
                        <span class="value-display" id="blurValue">0</span>
                    </div>

                    <div class="control-group">
                        <label for="grain">Grain (Зернистость)</label>
                        <input type="range" id="grain" min="0" max="100" step="1" value="0">
                        <span class="value-display" id="grainValue">0</span>
                    </div>

                    <div class="control-group">
                        <label for="gamma">Gamma (Гамма)</label>
                        <input type="range" id="gamma" min="0.1" max="3" step="0.1" value="1">
                        <span class="value-display" id="gammaValue">1.0</span>
                    </div>

                    <div class="control-group">
                        <label for="blackPoint">Black Point (Черная точка)</label>
                        <input type="range" id="blackPoint" min="0" max="255" step="1" value="0">
                        <span class="value-display" id="blackPointValue">0</span>
                    </div>

                    <div class="control-group">
                        <label for="whitePoint">White Point (Белая точка)</label>
                        <input type="range" id="whitePoint" min="0" max="255" step="1" value="255">
                        <span class="value-display" id="whitePointValue">255</span>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Настройки дизеринга</h3>
                    
                    <div class="control-group">
                        <label>Pattern (Паттерн)</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="pattern" value="floyd-steinberg" checked>
                                <span>Floyd-Steinberg</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="pattern" value="bayer">
                                <span>Bayer</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="pattern" value="random">
                                <span>Random</span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="pixelSize">Pixel Size (Размер пикселя)</label>
                        <input type="range" id="pixelSize" min="1" max="16" step="1" value="1">
                        <span class="value-display" id="pixelSizeValue">1</span>
                    </div>

                    <div class="control-group">
                        <label for="threshold">Threshold (Порог)</label>
                        <input type="range" id="threshold" min="0" max="255" step="1" value="128">
                        <span class="value-display" id="thresholdValue">128</span>
                    </div>

                    <div class="control-group">
                        <label>Color Mode (Цветовой режим)</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="colorMode" value="monochrome" checked>
                                <span>Монохром</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="colorMode" value="grayscale">
                                <span>Градации серого</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="colorMode" value="color">
                                <span>Цветной</span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="showEffect" checked>
                            Показать эффект
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <button class="btn-primary btn-full" id="exportBtn" disabled>
                        Экспортировать (Ctrl + S)
                    </button>
                    <button class="btn-secondary btn-full" id="resetBtn" disabled>
                        Сбросить настройки
                    </button>
                </div>
            </div>
        </div>
    </div>

    <button class="upload-btn-fixed" id="uploadBtnFixed" onclick="document.getElementById('imageInput').click()">
        + Добавить изображение
    </button>

    <script src="dither.js"></script>
</body>
</html>
