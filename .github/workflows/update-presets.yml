name: Update Presets Manifest

on:
  push:
    paths:
      - 'js/YF/lunnen/grid_generator/presets/*.json'
      - '!js/YF/lunnen/grid_generator/presets/manifest.json'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Generate manifest
        run: |
          cd js/YF/lunnen/grid_generator
          python3 generate-presets-manifest.py
          
      - name: Commit and push if changed
        run: |
          cd js/YF/lunnen/grid_generator
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add presets/manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update presets manifest" && git push)

