name: YF Tools CI

on:
  push:
    paths:
      - 'js/YF/**'
      - '.github/workflows/update-presets.yml'
  pull_request:
    paths:
      - 'js/YF/**'
      - '.github/workflows/update-presets.yml'

concurrency:
  group: grid-generator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/YF/grid_generator/tools/package-lock.json

      - name: Install tooling
        run: npm ci --prefix js/YF/grid_generator/tools

      - name: Verify source, presets, public runtime and tests
        run: npm --prefix js/YF run test:tier1 && npm --prefix js/YF run test:tier2 && npm --prefix js/YF run check:migration-foundation && npm --prefix js/YF run check:isolation

      - name: Build production runtime
        run: npm --prefix js/YF/grid_generator/tools run build
