name: Auto-generate Presets Manifest

# Автоматически запускается при пуше в main и при изменении файлов в presets/
on:
  push:
    branches:
      - main
    paths:
      - 'js/YF/lunnen/grid_generator/presets/*.json'
      - 'js/YF/lunnen/grid_generator/generate-presets-manifest.js'
  workflow_dispatch:  # Можно запустить вручную

# ВАЖНО: Даем workflow права на запись
permissions:
  contents: write

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      # 3. Генерируем manifest.json
      - name: Generate presets manifest
        run: |
          cd js/YF/lunnen/grid_generator
          node generate-presets-manifest.js
      
      # 4. Коммитим изменения (если manifest.json изменился)
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/YF/lunnen/grid_generator/presets/manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "🤖 Автообновление manifest.json [skip ci]"
            git push
          fi
