# Конфигурация для Netlify
# Этот файл указывает Netlify, что проект находится в подпапке

[build]
  # Базовая директория проекта (относительно корня репозитория)
  base = "js/YF/lunnen/grid_generator"
  
  # Команда сборки (генерация списка пресетов)
  command = "node generate-presets-manifest.js"
  
  # Папка для публикации (относительно base)
  publish = "."

# Настройки для Node.js
[build.environment]
  NODE_VERSION = "18"

# Настройки для обработки файлов
[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/presets/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

